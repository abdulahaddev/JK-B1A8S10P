# Copy to secrets.yaml and fill in your values. secrets.yaml is git-ignored.
wifi_ssid: "your-wifi"            # used by my-jk-bms-firebase.yaml
wifi_password: "your-password"
iot_wifi_ssid: "your-wifi"        # second network (not used by my-jk-bms-firebase.yaml)
iot_wifi_password: "your-password"
firebase_db_url: "https://<project>-default-rtdb.<region>.firebasedatabase.app"  # no trailing slash
firebase_auth: "<firebase-key>"
ota_base_url: "https://example.com"     # where jk-bms-<version>.ota.bin(.md5) are hosted, no trailing slash
ota_username: "user"                    # HTTP basic auth for that folder
ota_password: "password"
ota_local_password: "change-me"         # for esphome run over the local network
ftp_host: "ftp.example.com"               # explicit FTPS upload of OTA files (tools/ota_release.py)
ftp_port: "21"
ftp_user: "user"                          # account whose root is the OTA site root
ftp_password: "password"
