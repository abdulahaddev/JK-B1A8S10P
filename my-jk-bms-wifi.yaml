    cell_voltage_4:
      name: "Cell Voltage 4"
    cell_voltage_5:
      name: "Cell Voltage 5"
    cell_voltage_6:
      name: "Cell Voltage 6"
    cell_voltage_7:
      name: "Cell Voltage 7"
    cell_voltage_8:
