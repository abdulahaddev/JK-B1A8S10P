substitutions:
  name: jk-bms
  device_description: "Monitor and control JK-B1A8S10P via BLE with Status LEDs, WiFi, and OLED Display"
  protocol_version: JK02_32S
  bms_mac_address: "a4:c1:38:0b:82:42"
  log_level: DEBUG            # Change to NONE to turn OFF logging
  log_baud_rate: "115200"     # Change to 0 to turn OFF serial output
  debug_interval: "15s"       # Change to 'never' to turn OFF the debug sensor
  red_led_pin: GPIO2          # D2 on ESP32 DevKit (BLE Red)
  green_led_pin: GPIO4        # D4 on ESP32 DevKit (BLE Green)
  wifi_red_led_pin: GPIO16    # D16 on ESP32 DevKit (WiFi Red)
  wifi_green_led_pin: GPIO17  # D17 on ESP32 DevKit (WiFi Green)
  i2c_sda_pin: GPIO21         # D21 on ESP32 DevKit (OLED SDA)
  i2c_scl_pin: GPIO22         # D22 on ESP32 DevKit (OLED SCL)

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret iot_wifi_ssid
  password: !secret iot_wifi_password

# I2C Bus for 0.96" OLED Display (SDA: D21, SCL: D22)
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: false
  frequency: 400kHz
  id: bus_a

# Fonts for OLED Display
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_main
    size: 14

# 0.96" Inch I2C OLED Display (128x64, 7-bit address 0x3C corresponding to 8-bit 0x78)
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    i2c_id: bus_a
    id: oled_display
    update_interval: 1s
    lambda: |-
      // 1. Header (y=0..11)
      it.print(2, 0, id(font_small), "JK-BMS");

      // Connection Indicators in Header
      auto ble_connected = (id(client0)->state() == esphome::esp32_ble_tracker::ClientState::ESTABLISHED ||
                            id(client0)->state() == esphome::esp32_ble_tracker::ClientState::CONNECTED);
      if (ble_connected) {
        it.print(52, 0, id(font_small), "BT");
      }

      bool wifi_connected = false;
      if (esphome::wifi::global_wifi_component != nullptr) {
        wifi_connected = esphome::wifi::global_wifi_component->is_connected();
      }
      if (wifi_connected) {
        it.print(70, 0, id(font_small), "WF");
      }

      if (id(bms_state_of_charge).has_state() && !std::isnan(id(bms_state_of_charge).state)) {
        it.printf(98, 0, id(font_small), "%3.0f%%", id(bms_state_of_charge).state);
      }

      // Divider Line 1
      it.line(0, 12, 127, 12);

      // 2. Battery Voltage (y=15..28)
      it.print(2, 15, id(font_main), "VOLT:");
      if (id(bms_total_voltage).has_state() && !std::isnan(id(bms_total_voltage).state)) {
        it.printf(56, 15, id(font_main), "%5.2f V", id(bms_total_voltage).state);
      } else {
        it.print(56, 15, id(font_main), "--.-- V");
      }

      // 3. Current with +/- sign indicator (y=30..43)
      it.print(2, 30, id(font_main), "CURR:");
      if (id(bms_current).has_state() && !std::isnan(id(bms_current).state)) {
        it.printf(56, 30, id(font_main), "%+6.2f A", id(bms_current).state);
      } else {
        it.print(56, 30, id(font_main), "--.-- A");
      }

      // Divider Line 2
      it.line(0, 46, 127, 46);

      // 4. Balancer & Discharge ON/OFF Status (y=49..62)
      bool bal_on = false;
      if (id(bms_balancer_switch).has_state()) {
        bal_on = id(bms_balancer_switch).state;
      } else if (id(bms_balancing).has_state()) {
        bal_on = id(bms_balancing).state;
      }

      bool dsg_on = false;
      if (id(bms_discharging_switch).has_state()) {
        dsg_on = id(bms_discharging_switch).state;
      } else if (id(bms_discharging).has_state()) {
        dsg_on = id(bms_discharging).state;
      }

      it.printf(4, 49, id(font_small), "BAL: %s", bal_on ? "ON" : "OFF");
      it.printf(68, 49, id(font_small), "DSG: %s", dsg_on ? "ON" : "OFF");

external_components:
  # jk_bms_ble from upstream, pinned to the commit this project was tested with
  - source: github://syssi/esphome-jk-bms@58385c78dc7248bd7bc1040677b05a46a5be42d3
    components: [jk_bms_ble]
    refresh: 0s

logger:
  level: ${log_level}
  baud_rate: ${log_baud_rate}
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO
    wifi: INFO
    scheduler: INFO
    component: INFO
    i2c: WARN
    i2c.idf: WARN
    ssd1306_i2c: WARN
    ssd1306_base: WARN
    display: WARN

# Output pins for Status LEDs:
# - BLE:  D2 = Red,  D4 = Green
# - WiFi: D16 = Red, D17 = Green
output:
  - platform: gpio
    pin: ${red_led_pin}
    id: led_ble_red
  - platform: gpio
    pin: ${green_led_pin}
    id: led_ble_green
  - platform: gpio
    pin: ${wifi_red_led_pin}
    id: led_wifi_red
  - platform: gpio
    pin: ${wifi_green_led_pin}
    id: led_wifi_green

globals:
  - id: ble_rx_pulse
    type: bool
    initial_value: 'false'

# State machine for LEDs:
# 1. BLE LEDs (D2 Red, D4 Green):
#    - BLE Scan / Idle: Red blinks normal (500ms ON / 500ms OFF), Green OFF
#    - Connecting: Red blinks fast (100ms toggle), Green OFF
#    - Connected: Red OFF, Green ON
# 2. WiFi LEDs (D16 Red, D17 Green):
#    - Disconnected / Connecting: Red blinks normal (500ms ON / 500ms OFF), Green OFF
#    - Connected: Red OFF, Green ON
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t tick = 0;
          tick++;

          // ==================== BLE LED LOGIC ====================
          auto ble_st = id(client0)->state();
          if (ble_st == esphome::esp32_ble_tracker::ClientState::ESTABLISHED ||
              ble_st == esphome::esp32_ble_tracker::ClientState::CONNECTED) {
            // Connected: Red is OFF, Green is ON (pulsed off briefly on RX)
            id(led_ble_red)->turn_off();
            if (id(ble_rx_pulse)) {
              id(led_ble_green)->turn_off();
              id(ble_rx_pulse) = false; // Turn off for one tick (100ms)
            } else {
              id(led_ble_green)->turn_on();
            }
          } else if (ble_st == esphome::esp32_ble_tracker::ClientState::CONNECTING ||
                     ble_st == esphome::esp32_ble_tracker::ClientState::DISCOVERED) {
            // Connecting: Blink faster (100ms toggle), Green is OFF
            id(led_ble_green)->turn_off();
            if (tick % 2 == 0) {
              id(led_ble_red)->turn_on();
            } else {
              id(led_ble_red)->turn_off();
            }
          } else {
            // BLE Scan / Idle / Disconnected: Blink normal (500ms ON, 500ms OFF)
            id(led_ble_green)->turn_off();
            if ((tick % 10) < 5) {
              id(led_ble_red)->turn_on();
            } else {
              id(led_ble_red)->turn_off();
            }
          }

          // ==================== WIFI LED LOGIC ====================
          bool wifi_connected = false;
          if (esphome::wifi::global_wifi_component != nullptr) {
            wifi_connected = esphome::wifi::global_wifi_component->is_connected();
          }

          if (wifi_connected) {
            // Connected: Red is OFF, Green is ON
            id(led_wifi_red)->turn_off();
            id(led_wifi_green)->turn_on();
          } else {
            // Disconnected / Connecting: Blink normal (500ms ON, 500ms OFF), Green is OFF
            id(led_wifi_green)->turn_off();
            if ((tick % 10) < 5) {
              id(led_wifi_red)->turn_on();
            } else {
              id(led_wifi_red)->turn_off();
            }
          }

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${bms_mac_address}
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    id: bms0
    protocol_version: ${protocol_version}
    throttle: 2s

sensor:
  - platform: template
    name: "ESP32 Free Memory"
    unit_of_measurement: "bytes"
    update_interval: ${debug_interval}
    lambda: |-
      return esp_get_free_heap_size();

  - platform: jk_bms_ble
    jk_bms_ble_id: bms0

    # Cell Voltages (1-8)
    cell_voltage_1:
      name: "Cell Voltage 1"
    cell_voltage_2:
      name: "Cell Voltage 2"
    cell_voltage_3:
      name: "Cell Voltage 3"
    cell_voltage_4:
      name: "Cell Voltage 4"
    cell_voltage_5:
      name: "Cell Voltage 5"
    cell_voltage_6:
      name: "Cell Voltage 6"
    cell_voltage_7:
      name: "Cell Voltage 7"
    cell_voltage_8:
      name: "Cell Voltage 8"

    # Cell Resistances (1-8)
    cell_resistance_1:
      name: "Cell Resistance 1"
    cell_resistance_2:
      name: "Cell Resistance 2"
    cell_resistance_3:
      name: "Cell Resistance 3"
    cell_resistance_4:
      name: "Cell Resistance 4"
    cell_resistance_5:
      name: "Cell Resistance 5"
    cell_resistance_6:
      name: "Cell Resistance 6"
    cell_resistance_7:
      name: "Cell Resistance 7"
    cell_resistance_8:
      name: "Cell Resistance 8"

    # Overall Battery Metrics
    total_voltage:
      name: "Total Voltage"
      id: bms_total_voltage
      on_value:
        then:
          - lambda: |-
              id(ble_rx_pulse) = true;
    current:
      name: "Current"
      id: bms_current
    power:
      name: "Power"
    charging_power:
      name: "Charging Power"
    discharging_power:
      name: "Discharging Power"
    balancing_current:
      name: "Balancing Current"

    # Cell Statistics
    min_cell_voltage:
      name: "Min Cell Voltage"
    max_cell_voltage:
      name: "Max Cell Voltage"
    min_voltage_cell:
      name: "Min Voltage Cell"
    max_voltage_cell:
      name: "Max Voltage Cell"
    delta_cell_voltage:
      name: "Delta Cell Voltage"
    average_cell_voltage:
      name: "Average Cell Voltage"

    # Battery Capacity & State
    state_of_charge:
      name: "State of Charge"
      id: bms_state_of_charge
    state_of_health:
      name: "State of Health"
    capacity_remaining:
      name: "Capacity Remaining"
    full_charge_capacity:
      name: "Full Charge Capacity"
    charging_cycles:
      name: "Charging Cycles"
    total_charging_cycle_capacity:
      name: "Total Charging Cycle Capacity"

    # Temperatures
    mosfet_temperature:
      name: "MOSFET Temperature"
    temperature_sensor_1:
      name: "Temperature Sensor 1"
    temperature_sensor_2:
      name: "Temperature Sensor 2"

    # Diagnostic Counters
    total_runtime:
      name: "Total Runtime"
    smart_sleep_countdown:
      name: "Smart Sleep Countdown"

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    errors:
      name: "Errors"
    errors_bitmask_hex:
      name: "Errors Bitmask Hex"
    balancer_status:
      name: "Balancer Status"
    total_runtime_formatted:
      name: "Total Runtime Formatted"
    software_version:
      name: "Software Version"
    hardware_version:
      name: "Hardware Version"
    device_model:
      name: "Device Model"
    manufacturing_date:
      name: "Manufacturing Date"
    serial_number:
      name: "Serial Number"

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Charging"
    discharging:
      name: "Discharging"
      id: bms_discharging
    balancing:
      name: "Balancing"
      id: bms_balancing
    heating:
      name: "Heating"
    online_status:
      name: "Online Status"

switch:
  - platform: jk_bms_ble
    charging:
      name: "Charging Switch"
      id: bms_charging_switch
    discharging:
      name: "Discharging Switch"
      id: bms_discharging_switch
    balancer:
      name: "Balancer Switch"
      id: bms_balancer_switch
