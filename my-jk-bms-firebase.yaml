substitutions:
  name: jk-bms
  device_description: "Monitor and control JK-B1A8S10P via BLE with Status LEDs, WiFi, and OLED Display"
  protocol_version: JK02_32S
  bms_mac_address: "a4:c1:38:0b:82:42"
  log_level: INFO             # DEBUG logs every sensor and delays the OLED redraw ~110ms; NONE turns logging OFF
  log_baud_rate: "115200"     # Change to 0 to turn OFF serial output
  debug_interval: "15s"       # Change to 'never' to turn OFF the debug sensor
  upload_interval: "10s"      # Firebase upload interval
  red_led_pin: GPIO2          # D2 on ESP32 DevKit (BLE Red)
  green_led_pin: GPIO4        # D4 on ESP32 DevKit (BLE Green)
  wifi_red_led_pin: GPIO16    # D16 on ESP32 DevKit (WiFi Red)
  wifi_green_led_pin: GPIO17  # D17 on ESP32 DevKit (WiFi Green)
  i2c_sda_pin: GPIO21         # D21 on ESP32 DevKit (OLED SDA)
  i2c_scl_pin: GPIO22         # D22 on ESP32 DevKit (OLED SCL)
  firebase_url: !secret firebase_url
  firebase_auth: !secret firebase_auth

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  includes:
    - <esp_bt.h>
  on_boot:
    priority: -100
    then:
      - script.execute: redraw_display
      # Raise BLE TX power from the default to the max (+9 dBm) so the BMS reliably hears our
      # connection request. Wait until the BLE controller is enabled (it starts in loop()).
      - wait_until:
          condition:
            lambda: 'return esp_bt_controller_get_status() == ESP_BT_CONTROLLER_STATUS_ENABLED;'
      - lambda: |-
          esp_ble_tx_power_set(ESP_BLE_PWR_TYPE_DEFAULT, ESP_PWR_LVL_P9);
          esp_ble_tx_power_set(ESP_BLE_PWR_TYPE_SCAN, ESP_PWR_LVL_P9);
          esp_ble_tx_power_set(ESP_BLE_PWR_TYPE_CONN_HDL0, ESP_PWR_LVL_P9);
          ESP_LOGI("ble_power", "BLE TX power set to +9 dBm (level %d)", esp_ble_tx_power_get(ESP_BLE_PWR_TYPE_DEFAULT));

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - script.execute: redraw_display
  on_disconnect:
    then:
      - script.execute: redraw_display

time:
  - platform: sntp
    id: sntp_time

# Uploads run in the main loop: DNS + TLS handshake can exceed the 5s task watchdog and reboot
# the ESP32. Extend the watchdog during a request and keep each request short.
http_request:
  verify_ssl: false
  timeout: 4s
  watchdog_timeout: 15s

# I2C Bus for 0.96" OLED Display (SDA: D21, SCL: D22)
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: false
  frequency: 400kHz
  id: bus_a

# Fonts for OLED Display
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_main
    size: 14

# 0.96" Inch I2C OLED Display (128x64, 7-bit address 0x3C corresponding to 8-bit 0x78)
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    i2c_id: bus_a
    id: oled_display
    update_interval: never  # redrawn by the redraw_display script on new data
    lambda: |-
      // 1. Header (y=0..11)
      it.print(2, 0, id(font_small), "JK-BMS");

      // Connection Indicators in Header
      auto ble_connected = (id(client0)->state() == esphome::esp32_ble_tracker::ClientState::ESTABLISHED ||
                            id(client0)->state() == esphome::esp32_ble_tracker::ClientState::CONNECTED);
      if (ble_connected) {
        it.print(52, 0, id(font_small), "BT");
      }

      bool wifi_connected = false;
      if (esphome::wifi::global_wifi_component != nullptr) {
        wifi_connected = esphome::wifi::global_wifi_component->is_connected();
      }
      if (wifi_connected) {
        it.print(70, 0, id(font_small), "WF");
      }

      if (id(bms_state_of_charge).has_state() && !std::isnan(id(bms_state_of_charge).state)) {
        it.printf(98, 0, id(font_small), "%3.0f%%", id(bms_state_of_charge).state);
      }

      // Divider Line 1
      it.line(0, 12, 127, 12);

      // 2. Battery Voltage (y=15..28)
      it.print(2, 15, id(font_main), "VOLT:");
      if (id(bms_total_voltage).has_state() && !std::isnan(id(bms_total_voltage).state)) {
        it.printf(56, 15, id(font_main), "%5.2f V", id(bms_total_voltage).state);
      } else {
        it.print(56, 15, id(font_main), "--.-- V");
      }

      // 3. Current with +/- sign indicator (y=30..43)
      it.print(2, 30, id(font_main), "CURR:");
      if (id(bms_current).has_state() && !std::isnan(id(bms_current).state)) {
        it.printf(56, 30, id(font_main), "%+6.2f A", id(bms_current).state);
      } else {
        it.print(56, 30, id(font_main), "--.-- A");
      }

      // Divider Line 2
      it.line(0, 46, 127, 46);

      // 4. Balancer & Discharge ON/OFF Status (y=49..62)
      bool bal_on = false;
      if (id(bms_balancer_switch).has_state()) {
        bal_on = id(bms_balancer_switch).state;
      } else if (id(bms_balancing).has_state()) {
        bal_on = id(bms_balancing).state;
      }

      bool dsg_on = false;
      if (id(bms_discharging_switch).has_state()) {
        dsg_on = id(bms_discharging_switch).state;
      } else if (id(bms_discharging).has_state()) {
        dsg_on = id(bms_discharging).state;
      }

      it.printf(4, 49, id(font_small), "BAL: %s", bal_on ? "ON" : "OFF");
      it.printf(68, 49, id(font_small), "DSG: %s", dsg_on ? "ON" : "OFF");

external_components:
  # jk_bms_ble from upstream, pinned to the commit this project was tested with
  - source: github://syssi/esphome-jk-bms@58385c78dc7248bd7bc1040677b05a46a5be42d3
    components: [jk_bms_ble]
    refresh: 0s

logger:
  level: ${log_level}
  baud_rate: ${log_baud_rate}
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO
    wifi: INFO
    scheduler: INFO
    component: INFO
    i2c: WARN
    i2c.idf: WARN
    ssd1306_i2c: WARN
    ssd1306_base: WARN
    display: WARN

# Output pins for Status LEDs:
# - BLE:  D2 = Red,  D4 = Green
# - WiFi: D16 = Red, D17 = Green
output:
  - platform: gpio
    pin: ${red_led_pin}
    id: led_ble_red
  - platform: gpio
    pin: ${green_led_pin}
    id: led_ble_green
  - platform: gpio
    pin: ${wifi_red_led_pin}
    id: led_wifi_red
  - platform: gpio
    pin: ${wifi_green_led_pin}
    id: led_wifi_green

globals:
  - id: bms_fresh_frame   # a new BMS frame arrived since the last upload
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_tx_pulse
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ble_rx_pulse
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: firebase_error
    type: bool
    restore_value: no
    initial_value: 'false'

# State machine for LEDs:
# 1. BLE LEDs (D2 Red, D4 Green):
#    - BLE Scan / Idle: Red blinks normal (500ms ON / 500ms OFF), Green OFF
#    - Connecting: Red blinks fast (100ms toggle), Green OFF
#    - Connected: Red OFF, Green ON
# 2. WiFi LEDs (D16 Red, D17 Green):
#    - Disconnected / Connecting: Red blinks normal (500ms ON / 500ms OFF), Green OFF
#    - Connected: Red OFF, Green ON (Red fast blink on Firebase error)
interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t tick = 0;
          tick++;

          // ==================== BLE LED LOGIC ====================
          auto ble_st = id(client0)->state();
          bool bms_has_error = false;
          if (id(bms_errors).state != "" && id(bms_errors).state != "None") {
            bms_has_error = true;
          }
          
          if (ble_st == esphome::esp32_ble_tracker::ClientState::ESTABLISHED ||
              ble_st == esphome::esp32_ble_tracker::ClientState::CONNECTED) {
            if (bms_has_error) {
              id(led_ble_green)->turn_off();
              if (tick % 2 == 0) id(led_ble_red)->turn_on();
              else id(led_ble_red)->turn_off();
            } else {
              id(led_ble_red)->turn_off();
              if (id(ble_rx_pulse)) {
                id(led_ble_green)->turn_off();
                id(ble_rx_pulse) = false;
              } else {
                id(led_ble_green)->turn_on();
              }
            }
          } else if (ble_st == esphome::esp32_ble_tracker::ClientState::CONNECTING ||
                     ble_st == esphome::esp32_ble_tracker::ClientState::DISCOVERED) {
            // Connecting: Blink faster (100ms toggle), Green is OFF
            id(led_ble_green)->turn_off();
            if (tick % 2 == 0) {
              id(led_ble_red)->turn_on();
            } else {
              id(led_ble_red)->turn_off();
            }
          } else {
            // BLE Scan / Idle / Disconnected: Blink normal (500ms ON, 500ms OFF)
            id(led_ble_green)->turn_off();
            if ((tick % 10) < 5) {
              id(led_ble_red)->turn_on();
            } else {
              id(led_ble_red)->turn_off();
            }
          }

          // ==================== WIFI LED LOGIC ====================
          bool wifi_connected = false;
          if (esphome::wifi::global_wifi_component != nullptr) {
            wifi_connected = esphome::wifi::global_wifi_component->is_connected();
          }

          if (wifi_connected) {
            if (id(firebase_error)) {
              id(led_wifi_green)->turn_off();
              if (tick % 2 == 0) id(led_wifi_red)->turn_on();
              else id(led_wifi_red)->turn_off();
            } else {
              id(led_wifi_red)->turn_off();
              if (id(wifi_tx_pulse)) {
                id(led_wifi_green)->turn_off();
                id(wifi_tx_pulse) = false;
              } else {
                id(led_wifi_green)->turn_on();
              }
            }
          } else {
            // Disconnected / Connecting: Blink normal (500ms ON, 500ms OFF), Green is OFF
            id(led_wifi_green)->turn_off();
            if ((tick % 10) < 5) {
              id(led_wifi_red)->turn_on();
            } else {
              id(led_wifi_red)->turn_off();
            }
          }

  # Upload one reading per interval to telemetry/<unix_ts>.json, only when the BMS is online
  - interval: ${upload_interval}
    id: firebase_upload_interval
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - binary_sensor.is_on: bms_online_status
              - lambda: 'return id(sntp_time).now().is_valid();'
              # online_status stays on for a while after a BLE drop; don't re-upload old values
              - lambda: 'return id(bms_fresh_frame);'
          then:
            - lambda: |-
                id(wifi_tx_pulse) = true;
                id(bms_fresh_frame) = false;
            - http_request.send:
                method: PUT
                url: !lambda |-
                  return "${firebase_url}/" + std::to_string(id(sntp_time).now().timestamp) + ".json?auth=${firebase_auth}";
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["esp32_free_memory"] = id(bms_esp32_free_memory).state;
                  root["cell_voltage_1"] = id(bms_cell_voltage_1).state;
                  root["cell_voltage_2"] = id(bms_cell_voltage_2).state;
                  root["cell_voltage_3"] = id(bms_cell_voltage_3).state;
                  root["cell_voltage_4"] = id(bms_cell_voltage_4).state;
                  root["cell_resistance_1"] = id(bms_cell_resistance_1).state;
                  root["cell_resistance_2"] = id(bms_cell_resistance_2).state;
                  root["cell_resistance_3"] = id(bms_cell_resistance_3).state;
                  root["cell_resistance_4"] = id(bms_cell_resistance_4).state;
                  root["total_voltage"] = id(bms_total_voltage).state;
                  root["current"] = id(bms_current).state;
                  root["power"] = id(bms_power).state;
                  root["charging_power"] = id(bms_charging_power).state;
                  root["discharging_power"] = id(bms_discharging_power).state;
                  root["balancing_current"] = id(bms_balancing_current).state;
                  root["min_cell_voltage"] = id(bms_min_cell_voltage).state;
                  root["max_cell_voltage"] = id(bms_max_cell_voltage).state;
                  root["min_voltage_cell"] = id(bms_min_voltage_cell).state;
                  root["max_voltage_cell"] = id(bms_max_voltage_cell).state;
                  root["delta_cell_voltage"] = id(bms_delta_cell_voltage).state;
                  root["average_cell_voltage"] = id(bms_average_cell_voltage).state;
                  root["state_of_charge"] = id(bms_state_of_charge).state;
                  root["state_of_health"] = id(bms_state_of_health).state;
                  root["capacity_remaining"] = id(bms_capacity_remaining).state;
                  root["full_charge_capacity"] = id(bms_full_charge_capacity).state;
                  root["charging_cycles"] = id(bms_charging_cycles).state;
                  root["total_charging_cycle_capacity"] = id(bms_total_charging_cycle_capacity).state;
                  root["mosfet_temperature"] = id(bms_mosfet_temperature).state;
                  root["temperature_sensor_1"] = id(bms_temperature_sensor_1).state;
                  root["temperature_sensor_2"] = id(bms_temperature_sensor_2).state;
                  root["total_runtime"] = id(bms_total_runtime).state;
                  root["smart_sleep_countdown"] = id(bms_smart_sleep_countdown).state;
                  // Booleans as 0/1 to match the existing data in Firebase
                  root["charging"] = int(id(bms_charging).state);
                  root["discharging"] = int(id(bms_discharging).state);
                  root["balancing"] = int(id(bms_balancing).state);
                  root["heating"] = int(id(bms_heating).state);
                  root["online_status"] = int(id(bms_online_status).state);
                  root["charging_switch"] = int(id(bms_charging_switch).state);
                  root["discharging_switch"] = int(id(bms_discharging_switch).state);
                  root["balancer_switch"] = int(id(bms_balancer_switch).state);
                on_response:
                  then:
                    - lambda: |-
                        id(firebase_error) = response->status_code < 200 || response->status_code >= 300;
                        if (id(firebase_error)) ESP_LOGW("firebase", "Upload failed with code %d", response->status_code);
                on_error:
                  then:
                    - lambda: |-
                        id(firebase_error) = true;
                        ESP_LOGE("firebase", "HTTP request error");

# Short scan window (~9% duty) leaves radio time for the BMS connection and WiFi
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false

ble_client:
  - mac_address: ${bms_mac_address}
    id: client0
    on_connect:
      then:
        - script.execute: redraw_display
    on_disconnect:
      then:
        - script.execute: redraw_display

# Redraw the OLED when data or connection state changes instead of polling.
# The 0s delay runs the redraw on the next loop pass, after the whole BMS frame has been
# published; mode: single folds several triggers in the same pass into one redraw.
script:
  - id: redraw_display
    mode: single
    then:
      - delay: 0s
      - component.update: oled_display

jk_bms_ble:
  - ble_client_id: client0
    id: bms0
    protocol_version: ${protocol_version}
    throttle: 2s

sensor:
  - platform: template
    name: "ESP32 Free Memory"
    id: bms_esp32_free_memory
    unit_of_measurement: "bytes"
    update_interval: ${debug_interval}
    lambda: |-
      return esp_get_free_heap_size();

  - platform: jk_bms_ble
    jk_bms_ble_id: bms0

    # Cell Voltages (1-8)
    cell_voltage_1:
      name: "Cell Voltage 1"
      id: bms_cell_voltage_1
    cell_voltage_2:
      name: "Cell Voltage 2"
      id: bms_cell_voltage_2
    cell_voltage_3:
      name: "Cell Voltage 3"
      id: bms_cell_voltage_3
    cell_voltage_4:
      name: "Cell Voltage 4"
      id: bms_cell_voltage_4

    # Cell Resistances (1-4)
    cell_resistance_1:
      name: "Cell Resistance 1"
      id: bms_cell_resistance_1
    cell_resistance_2:
      name: "Cell Resistance 2"
      id: bms_cell_resistance_2
    cell_resistance_3:
      name: "Cell Resistance 3"
      id: bms_cell_resistance_3
    cell_resistance_4:
      name: "Cell Resistance 4"
      id: bms_cell_resistance_4

    # Overall Battery Metrics
    total_voltage:
      name: "Total Voltage"
      id: bms_total_voltage
      on_value:
        then:
          - lambda: |-
              id(ble_rx_pulse) = true;
              id(bms_fresh_frame) = true;
          - script.execute: redraw_display
    current:
      name: "Current"
      id: bms_current
    power:
      name: "Power"
      id: bms_power
    charging_power:
      name: "Charging Power"
      id: bms_charging_power
    discharging_power:
      name: "Discharging Power"
      id: bms_discharging_power
    balancing_current:
      name: "Balancing Current"
      id: bms_balancing_current

    # Cell Statistics
    min_cell_voltage:
      name: "Min Cell Voltage"
      id: bms_min_cell_voltage
    max_cell_voltage:
      name: "Max Cell Voltage"
      id: bms_max_cell_voltage
    min_voltage_cell:
      name: "Min Voltage Cell"
      id: bms_min_voltage_cell
    max_voltage_cell:
      name: "Max Voltage Cell"
      id: bms_max_voltage_cell
    delta_cell_voltage:
      name: "Delta Cell Voltage"
      id: bms_delta_cell_voltage
    average_cell_voltage:
      name: "Average Cell Voltage"
      id: bms_average_cell_voltage

    # Battery Capacity & State
    state_of_charge:
      name: "State of Charge"
      id: bms_state_of_charge
    state_of_health:
      name: "State of Health"
      id: bms_state_of_health
    capacity_remaining:
      name: "Capacity Remaining"
      id: bms_capacity_remaining
    full_charge_capacity:
      name: "Full Charge Capacity"
      id: bms_full_charge_capacity
    charging_cycles:
      name: "Charging Cycles"
      id: bms_charging_cycles
    total_charging_cycle_capacity:
      name: "Total Charging Cycle Capacity"
      id: bms_total_charging_cycle_capacity

    # Temperatures
    mosfet_temperature:
      name: "MOSFET Temperature"
      id: bms_mosfet_temperature
    temperature_sensor_1:
      name: "Temperature Sensor 1"
      id: bms_temperature_sensor_1
    temperature_sensor_2:
      name: "Temperature Sensor 2"
      id: bms_temperature_sensor_2

    # Diagnostic Counters
    total_runtime:
      name: "Total Runtime"
      id: bms_total_runtime
    smart_sleep_countdown:
      name: "Smart Sleep Countdown"
      id: bms_smart_sleep_countdown

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    errors:
      name: "Errors"
      id: bms_errors
    errors_bitmask_hex:
      name: "Errors Bitmask Hex"
      id: bms_errors_bitmask_hex
    balancer_status:
      name: "Balancer Status"
      id: bms_balancer_status
    total_runtime_formatted:
      name: "Total Runtime Formatted"
      id: bms_total_runtime_formatted
    software_version:
      name: "Software Version"
      id: bms_software_version
    hardware_version:
      name: "Hardware Version"
      id: bms_hardware_version
    device_model:
      name: "Device Model"
      id: bms_device_model
    manufacturing_date:
      name: "Manufacturing Date"
      id: bms_manufacturing_date
    serial_number:
      name: "Serial Number"
      id: bms_serial_number

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Charging"
      id: bms_charging
    discharging:
      name: "Discharging"
      id: bms_discharging
    balancing:
      name: "Balancing"
      id: bms_balancing
    heating:
      name: "Heating"
      id: bms_heating
    online_status:
      name: "Online Status"
      id: bms_online_status

switch:
  - platform: jk_bms_ble
    charging:
      name: "Charging Switch"
      id: bms_charging_switch
    discharging:
      name: "Discharging Switch"
      id: bms_discharging_switch
      on_state:
        then:
          - script.execute: redraw_display
    balancer:
      name: "Balancer Switch"
      id: bms_balancer_switch
      on_state:
        then:
          - script.execute: redraw_display
