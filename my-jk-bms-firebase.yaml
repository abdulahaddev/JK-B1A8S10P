substitutions:
  name: jk-bms
  fw_version: "1.2.28"         # Bump for every OTA release; the OTA file is jk-bms-<fw_version>.ota.bin
  device_description: "Monitor JK-B1A8S10P via BLE with OLED display and Firebase upload"
  protocol_version: JK02_32S
  bms_mac_address: "a4:c1:38:0b:82:42"
  log_level: INFO             # DEBUG logs every sensor and delays the OLED redraw ~110ms; NONE turns logging OFF
  log_baud_rate: "115200"     # Change to 0 to turn OFF serial output
  sample_interval: "30s"      # One telemetry reading into the buffer
  sample_interval_ms: "30000" # Same, in ms (upload timing); keep both in sync
  upload_check_interval: "10s"
  upload_batch_max: "8"       # Hard ceiling, never crossed; the learned limits normally stay below it
  # The batch is the smallest of the memory fit, the adaptive limit (grows while uploads are quick and
  # succeed, halves when one is slow or fails) and upload_batch_max.
  # Memory fit is measured, not assumed: every upload records its own heap low point
  # (heap_caps_monitor_local_minimum_free_size_*), learns from it the fixed cost of a request (TLS +
  # body) and the cost per reading, and the next batch keeps the low point above upload_heap_floor.
  # A low point below the floor halves the adaptive limit at once.
  upload_heap_base_init: "24000"  # First estimate of the fixed cost; replaced by measurements
  upload_heap_per_reading: "1000" # First estimate per reading; replaced by measurements
  upload_heap_floor: "22000"      # Free heap that must remain at the low point of an upload
  upload_min_block: "16000"   # Largest free block below this: send 1 reading only
  # Free time: with a backlog, extra uploads run later in the 30 s cycle while the learned upload time
  # plus this gap still ends before the next reading (the gap leaves room for fresh BMS frames)
  upload_gap_ms: "6000"
  upload_min_batch: "2"       # Upload once this many readings wait (about every 60s)...
  upload_max_age_ms: "60000"  # ...or at least this often, so device diagnostics stay fresh
  # An upload blocks the main loop (median 4.8 s, logs/phase44) and shares the radio with BLE, so it
  # starts right after a reading is stored, at most once per reading, leaving the rest of the 30 s
  # cycle to the BMS link. Uploads slower than the budget shrink the next batch.
  upload_phase_ms: "12000"
  upload_time_budget_ms: "8000"
  upload_backoff_max_ms: "120000" # Failed uploads wait 10, 20, 40, 80, 120 s (30 s max while confirming an update)
  # An accepted update pauses uploads at once; the queue uploads after the reboot (RTC ring) or after a
  # failed attempt. Only readings in the RAM ring (older than the newest 280) would be lost to the reboot,
  # so while there are any, uploads continue until they are gone, at most this long.
  ota_backlog_wait_ms: "1800000"
  info_refresh_ms: "86400000" # Re-send the info node daily even if nothing changed
  energy_interval_ms: "3600000"
  i2c_sda_pin: GPIO21         # D21 on ESP32 DevKit (OLED SDA)
  i2c_scl_pin: GPIO22         # D22 on ESP32 DevKit (OLED SCL)
  firebase_db_url: !secret firebase_db_url
  firebase_auth: !secret firebase_auth
  # The OTA host comes from control/ota_host (allowed domains in ota_control.h); the login stays here
  ota_username: !secret ota_username
  ota_password: !secret ota_password
  # control is read every control/check_s seconds (30..3600, default 300; not kept across reboots).
  # The first read runs ~30 s after boot, so a restarted board is reachable at once.
  control_default_s: "300"
  control_min_s: "30"
  control_max_s: "3600"
  ota_verify_timeout_ms: "600000"  # New firmware must upload to Firebase within 10 min or it rolls back
  radio_reset_fallback_ms: "120000"  # Radio reset after a software reset even without a successful upload
  ota_text_long_ms: "600000"  # OTA text replaces BAL/DSG this long after a failure or rollback
  ota_text_short_ms: "120000" # ...and this long after a confirmed update
  ble_dot_ms: "300"           # Dot at the BT icon after each BMS frame (~every 2.4 s)
  upload_dot_ms: "1000"       # Dot at the WiFi icon after each successful upload (~once a minute)
  # Self-healing: radio reset (1 s deep sleep) when the BMS link or WiFi stays down this long.
  # Each reset in a row doubles the wait (x1, x2, x4, x8); it starts over once both work again.
  ble_watchdog_ms: "600000"   # no BMS frame for 10 min
  ble_stale_ms: "120000"      # ...or 2 min while the link claims to be connected (a lost disconnect event)
  wifi_watchdog_ms: "1800000" # router visible in scans but no connection for 30 min (a stuck WiFi stack).
                              # Router off/out of range: never, the buffer keeps ~7 h and reconnects later.
  bad_request_limit: "3"      # drop a batch Firebase rejects with 400 this many times in a row
  maintenance_limit_ms: "180000"  # an OTA install or restart script still running after this is stuck

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: abdulahaddev.jk-bms
    version: ${fw_version}
  includes:
    - <esp_bt.h>
    - <esp_ota_ops.h>
    - <esp_sleep.h>
    - <esp_heap_caps.h>
    - <esp_timer.h>
    - <esp_wifi.h>
    - telemetry_buffer.h
    - crash_capture.h
    - radio_sleep.h
    - ota_control.h
    - <esphome/components/esp32/crash_handler.h>
  # Remember that the run ended through ESPHome (OTA reboot, safe_reboot) for the boots/ history
  on_shutdown:
    - lambda: 'telemetry::note_shutdown();'
  on_boot:
    - priority: 800
      then:
        # Restore buffered readings kept in RTC memory across a software reboot
        - lambda: |-
            telemetry::begin();
            crash::begin();
            // ESPHome printed its crash report before on_message was listening; print it again to collect it
            if (esphome::esp32::crash_handler_has_data()) esphome::esp32::crash_handler_log();
            if (crash::crashed()) ESP_LOGE("crash", "Previous run crashed in step %s", crash::last_step_name());
            ESP_LOGI("telemetry", "Boot %u (%s, cause %s), %u readings restored from RTC",
                     (unsigned) telemetry::boot_count(), telemetry::reset_reason(), telemetry::restart_cause(),
                     (unsigned) telemetry::size());
            const std::string cred = std::string("${ota_username}:") + "${ota_password}";
            id(ota_auth_header) = "Basic " + base64_encode((const uint8_t *) cred.data(), cred.size());
    - priority: 600
      then:
        # OTA state after boot: a fresh image waits for its first good upload (see firebase_upload_interval);
        # if we booted the old image again after an attempted update, that update was rolled back.
        - lambda: |-
            esp_ota_img_states_t state;
            id(ota_pending_verify) = esp_ota_get_state_partition(esp_ota_get_running_partition(), &state) == ESP_OK &&
                                     state == ESP_OTA_IMG_PENDING_VERIFY;
            if (id(ota_pending_verify)) {
              id(ota_status) = "verifying ${fw_version}";
              id(ota_display) = "OTA verifying ${fw_version}";
            } else if (id(ota_attempt_hash) != 0) {
              if (id(ota_attempt_hash) != fnv1_hash("${fw_version}")) {
                // Rolled back: the first control read removes control/ota if it still names that version
                id(ota_failed_hash) = id(ota_attempt_hash);
                id(ota_status) = "rolled back, running ${fw_version}";
                id(ota_display) = "OTA rolled back";
                id(ota_show_until) = millis() + ${ota_text_long_ms};
              }
              id(ota_attempt_hash) = 0;
              global_preferences->sync();
            }
            ESP_LOGI("ota", "Firmware ${fw_version}, %s", id(ota_status).c_str());
            // After a software reset (OTA reboot, crash, watchdog) BLE cannot connect to the BMS until the
            // radio is powered down; a 1 s deep sleep does that (see radio_reset).
            switch (esp_reset_reason()) {
              case ESP_RST_SW: case ESP_RST_PANIC: case ESP_RST_INT_WDT: case ESP_RST_TASK_WDT: case ESP_RST_WDT:
                id(needs_radio_reset) = true;
                break;
              default:
                break;
            }
    - priority: -100
      then:
        # After setup, so the WiFi component has created the default event loop
        - lambda: 'otactl::begin();  // records the reason of each WiFi disconnect (device/wifi_disc_reason)'
        - script.execute: redraw_display
        # Raise BLE TX power from the default to the max (+9 dBm) so the BMS reliably hears our
        # connection request. Wait until the BLE controller is enabled (it starts in loop()).
        - wait_until:
            condition:
              lambda: 'return esp_bt_controller_get_status() == ESP_BT_CONTROLLER_STATUS_ENABLED;'
        - lambda: |-
            esp_ble_tx_power_set(ESP_BLE_PWR_TYPE_DEFAULT, ESP_PWR_LVL_P9);
            esp_ble_tx_power_set(ESP_BLE_PWR_TYPE_SCAN, ESP_PWR_LVL_P9);
            esp_ble_tx_power_set(ESP_BLE_PWR_TYPE_CONN_HDL0, ESP_PWR_LVL_P9);
            ESP_LOGI("ble_power", "BLE TX power set to +9 dBm (level %d)", esp_ble_tx_power_get(ESP_BLE_PWR_TYPE_DEFAULT));

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      enable_ota_rollback: true  # Bootloader returns to the previous firmware if a new one is never confirmed
    sdkconfig_options:
      # Allocate TLS record buffers only while needed and free the parsed config after the
      # handshake: lowers the heap peak of every HTTPS request next to the BLE stack
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: y
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: y
      # Default 300 ms is tight with BLE + WiFi coexistence and flash writes (NVS, OTA state)
      CONFIG_ESP_INT_WDT_TIMEOUT_MS: "800"

# Required for OTA rollback. Normally confirms a boot after boot_is_good_after; we confirm earlier,
# on the first successful Firebase upload, so this only acts as a late fallback.
safe_mode:
  id: safe_mode_component
  boot_is_good_after: 15min

ota:
  # Local network flashing from the ESPHome CLI when on site
  - platform: esphome
    password: !secret ota_local_password
  # Remote update: downloads jk-bms-<version>.ota.bin when control/ota in Firebase asks for it
  - platform: http_request
    id: ota_http
    on_begin:
      then:
        - lambda: 'ESP_LOGI("ota", "Downloading %s", id(ota_target).c_str());'
    on_error:
      then:
        - lambda: |-
            crash::step(crash::STEP_IDLE);
            char err[8];
            snprintf(err, sizeof(err), "0x%02X", (unsigned) x);  // ota::OTAResponseTypes, e.g. 0x8B = MD5 mismatch, 0xFF = read error
            // One attempt per signal: report, then remove control/ota at once (forced control read)
            id(ota_status) = "download failed " + id(ota_target) + " (error " + err + ")";
            id(ota_attempt_hash) = 0;
            global_preferences->sync();
            ESP_LOGE("ota", "%s", id(ota_status).c_str());
            id(ota_display) = "OTA failed";
            id(ota_show_until) = millis() + ${ota_text_long_ms};
            id(ota_done) = id(ota_target);
            id(ota_active) = false;
            id(control_force) = true;
            // Modem sleep back on before BLE: WiFi + BT without it aborts in ESP-IDF
            esp_wifi_set_ps(WIFI_PS_MIN_MODEM);
            id(http_client)->set_timeout(8000);
            id(http_client)->set_watchdog_timeout(30000);
            id(client0)->set_auto_connect(true);
        - ble.enable:
        - script.execute: redraw_display
    # The download blocks the main loop, so redraw directly every 10%
    on_progress:
      then:
        - lambda: |-
            const int step = (int) x / 10;
            if (step == id(ota_progress_step)) return;
            id(ota_progress_step) = step;
            id(ota_display) = "OTA " + id(ota_target) + " " + std::to_string(step * 10) + "%";
            id(oled_display).update();

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Connect straight to the configured network instead of scanning first: with BLE busy every
  # 10ms, reconnect scans time out and WiFi stays down until the 15 min reboot_timeout.
  fast_connect: true
  # ESPHome would esp_restart after 15 min without WiFi; a soft reset leaves BLE unable to reach
  # the BMS, so the WiFi watchdog in the 30s interval does a radio reset instead.
  reboot_timeout: 0s
  on_connect:
    then:
      - script.execute: redraw_display
  on_disconnect:
    then:
      - lambda: 'id(wifi_disconnects)++;'
      - script.execute: redraw_display

time:
  - platform: sntp
    id: sntp_time

# Uploads run in the main loop: DNS + TLS handshake can exceed the 5s task watchdog and reboot
# the ESP32. Extend the watchdog during a request and keep each request short.
http_request:
  id: http_client
  verify_ssl: false
  # Identifies the board in web server logs (grep jk-bms-esp); whitelistable by rule
  useragent: "Mozilla/5.0 (compatible; jk-bms-esp/${fw_version}; ESPHome)"
  timeout: 8s   # per read. Every request blocks the main loop (display, BLE events); 15 s made failed connects freeze it 16 s. Download stalls are covered by the OTA retry backoff.
  watchdog_timeout: 30s  # DNS + TLS handshake on a weak link can exceed 15 s

# I2C Bus for 0.96" OLED Display (SDA: D21, SCL: D22)
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: false
  frequency: 400kHz
  id: bus_a

# Fonts for OLED Display
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_main
    size: 14

# 0.96" Inch I2C OLED Display (128x64, 7-bit address 0x3C corresponding to 8-bit 0x78)
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    i2c_id: bus_a
    id: oled_display
    update_interval: never  # redrawn by the redraw_display script on new data
    lambda: |-
      using CS = esphome::esp32_ble_tracker::ClientState;
      const uint32_t now = millis();
      const bool fast_on = (now / 500) % 2 == 0;
      const bool slow_on = (now / 1000) % 2 == 0;

      // 1. Header (y=0..11): title (or queued readings), BT icon, WiFi bars, SOC
      const size_t queued = telemetry::size();
      if (queued > ${upload_min_batch}) {
        it.printf(2, 0, id(font_small), "Q%u", (unsigned) queued);
      } else {
        it.print(2, 0, id(font_small), "JK-BMS");
      }

      // BT: solid when connected, fast blink while connecting, slow blink when disconnected.
      // "!" when the BMS reports an error.
      const auto bt = id(client0)->state();
      bool bt_show = slow_on;
      if (bt == CS::ESTABLISHED) {
        bt_show = true;
      } else if (bt == CS::CONNECTING || bt == CS::DISCOVERED || bt == CS::CONNECTED) {
        bt_show = fast_on;
      }
      if (bt_show) {
        const int x = 44, y = 1;
        it.line(x + 0, y + 2, x + 6, y + 6);
        it.line(x + 6, y + 6, x + 3, y + 9);
        it.line(x + 3, y + 9, x + 3, y + 0);
        it.line(x + 3, y + 0, x + 6, y + 3);
        it.line(x + 6, y + 3, x + 0, y + 7);
      }
      // Activity dot: flashes when a BMS frame arrives
      if (id(ble_rx_ms) != 0 && now - id(ble_rx_ms) < ${ble_dot_ms}) {
        it.filled_rectangle(51, 0, 2, 2);  // upper right of the BT icon
      }
      const std::string &errors = id(bms_errors).state;
      if (bt == CS::ESTABLISHED && !errors.empty() && errors != "None" && errors != "Offline") {
        it.print(55, 0, id(font_small), "!");
      }

      // WiFi: signal bars when connected, all bars slow blinking when disconnected.
      // "!" when the last Firebase upload failed.
      auto *wifi = esphome::wifi::global_wifi_component;
      const bool wifi_ok = wifi != nullptr && wifi->is_connected();
      int bars = 0;
      if (wifi_ok) {
        const int rssi = wifi->wifi_rssi();
        bars = rssi > -60 ? 4 : rssi > -70 ? 3 : rssi > -80 ? 2 : 1;
      }
      if (wifi_ok || slow_on) {
        for (int i = 0; i < 4; i++) {
          const int x = 62 + i * 3, h = 2 + i * 2;
          if (!wifi_ok || i < bars) {
            it.filled_rectangle(x, 10 - h, 2, h);
          } else {
            it.horizontal_line(x, 9, 2);
          }
        }
      }
      // Activity dot: flashes when an upload to Firebase succeeds
      if (id(fb_tx_ms) != 0 && now - id(fb_tx_ms) < ${upload_dot_ms}) {
        it.filled_rectangle(73, 0, 2, 2);  // upper right of the WiFi bars
      }
      if (wifi_ok && id(firebase_error)) {
        it.print(77, 0, id(font_small), "!");
      }

      if (id(bms_state_of_charge).has_state() && !std::isnan(id(bms_state_of_charge).state)) {
        it.printf(98, 0, id(font_small), "%3.0f%%", id(bms_state_of_charge).state);
      }

      // Divider Line 1
      it.line(0, 12, 127, 12);

      // 2. Battery Voltage (y=15..28)
      it.print(2, 15, id(font_main), "VOLT:");
      if (id(bms_total_voltage).has_state() && !std::isnan(id(bms_total_voltage).state)) {
        it.printf(56, 15, id(font_main), "%5.2f V", id(bms_total_voltage).state);
      } else {
        it.print(56, 15, id(font_main), "--.-- V");
      }

      // 3. Current with +/- sign indicator (y=30..43)
      it.print(2, 30, id(font_main), "CURR:");
      if (id(bms_current).has_state() && !std::isnan(id(bms_current).state)) {
        it.printf(56, 30, id(font_main), "%+6.2f A", id(bms_current).state);
      } else {
        it.print(56, 30, id(font_main), "--.-- A");
      }

      // Divider Line 2
      it.line(0, 46, 127, 46);

      // 4. Bottom row (y=49..62): OTA state while an update runs or just finished, else BAL/DSG
      if (id(ota_pending_verify) || (int32_t) (id(ota_show_until) - now) > 0) {
        it.print(4, 49, id(font_small), id(ota_display).c_str());
        return;
      }
      bool bal_on = false;
      if (id(bms_balancer_switch).has_state()) {
        bal_on = id(bms_balancer_switch).state;
      } else if (id(bms_balancing).has_state()) {
        bal_on = id(bms_balancing).state;
      }

      bool dsg_on = false;
      if (id(bms_discharging_switch).has_state()) {
        dsg_on = id(bms_discharging_switch).state;
      } else if (id(bms_discharging).has_state()) {
        dsg_on = id(bms_discharging).state;
      }

      it.printf(4, 49, id(font_small), "BAL: %s", bal_on ? "ON" : "OFF");
      it.printf(68, 49, id(font_small), "DSG: %s", dsg_on ? "ON" : "OFF");

external_components:
  # jk_bms_ble from upstream, pinned to the commit this project was tested with
  - source: github://syssi/esphome-jk-bms@58385c78dc7248bd7bc1040677b05a46a5be42d3
    components: [jk_bms_ble]
    refresh: 0s

logger:
  level: ${log_level}
  # Collect ESPHome's crash report lines for the crashes/ upload (crash_capture.h)
  on_message:
    level: ERROR
    then:
      - lambda: 'crash::collect(tag, message);'
  baud_rate: ${log_baud_rate}
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO
    wifi: INFO
    scheduler: INFO
    component: INFO
    i2c: WARN
    i2c.idf: WARN
    ssd1306_i2c: WARN
    ssd1306_base: WARN
    display: WARN

globals:
  - id: needs_radio_reset # booted from a software reset; do one radio_reset when safe
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: uploaded_since_boot
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: bms_adverts       # BMS advertisements heard since the last upload
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bms_rssi          # RSSI of the last BMS advertisement heard, 0 = none yet
    type: int
    restore_value: no
    initial_value: '0'
  - id: bms_fresh_frame   # a new BMS frame arrived since the last buffered reading
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: firebase_error    # last upload failed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: wifi_disconnects
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ble_disconnects
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_upload_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_batch_n    # readings included in the request in flight
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: info_sig          # last seen values of the info node, to detect changes
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: info_dirty
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: info_sent_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: info_in_flight
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: last_energy_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: energy_in_flight
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: upload_batch_last # batch size picked for the last upload (diagnostics)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_cap        # adaptive batch limit, 1..upload_batch_max
    type: uint32_t
    restore_value: no
    initial_value: '2'
  - id: upload_fresh_ts   # timestamp of the fresh reading in the request in flight, 0 = none
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_old_n      # backlog readings (oldest first) in the request in flight
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_ms_avg     # learned upload duration (moving average), for free-time uploads
    type: uint32_t
    restore_value: no
    initial_value: '6000'
  - id: upload_heap_before  # free heap when the request in flight started
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_heap_low   # heap low point of the last upload (diagnostics)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_heap_base  # learned fixed heap cost of a request (TLS + body)
    type: uint32_t
    restore_value: no
    initial_value: '${upload_heap_base_init}'
  - id: upload_heap_per   # learned heap cost per reading
    type: uint32_t
    restore_value: no
    initial_value: '${upload_heap_per_reading}'
  - id: upload_prev_used  # heap used and batch size of the previous upload (per-reading slope)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_prev_n
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_start_ms   # when the request in flight was built
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_ms_last    # how long the last upload blocked (diagnostics)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_fails      # failed uploads in a row (backoff)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_next_ms    # no upload before this (backoff after a failure)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: sample_seq        # readings stored since boot
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_seq        # sample_seq when the last upload started (one upload per reading)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_sample_ms    # when the last reading was stored
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # OTA. The two hashes are kept in flash so the previous firmware knows about a rolled-back update.
  - id: ota_attempt_hash  # fnv1 hash of the version being installed, 0 when none
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: ota_failed_hash   # version that rolled back; not retried until control/ota changes
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: restart_hash      # last control/restart value handled, so a request restarts only once
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: ota_pending_verify  # running a new image that is not confirmed yet
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ota_target        # version of the accepted or running install
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ota_base          # allowed OTA base URL for ota_target (from control/ota_host)
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ota_done          # version handled this boot (failed or refused): only cleaned from control, not retried
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ota_requested     # update accepted, install not started yet (uploads paused unless the RAM ring has readings)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ota_request_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ota_active        # install in progress (uploads paused)
    type: bool
    restore_value: no
    initial_value: 'false'
  # Control read (dynamic interval) and removal of handled commands
  - id: control_s         # interval in use, from control/check_s
    type: uint32_t
    restore_value: no
    initial_value: '${control_default_s}'
  - id: control_last_ms   # last control read, 0 = none yet
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: control_force     # read control at the next tick (after an OTA result)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: control_etag      # ETag of the control node as last read
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: control_put       # handled commands to remove: write control back without them (if-match etag)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: control_put_body
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: restart_go        # restart after the handled commands are removed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: check_target      # control/ota_check: version whose .md5 is fetched once
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: check_base
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: check_result      # device/ota_check
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: check_ts          # unix time of check_result (device/ota_check_ts)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_fail       # why the last upload failed (device/upload_fail)
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: upload_fail_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ota_status
    type: std::string
    restore_value: no
    initial_value: '"idle"'
  - id: ota_display       # short OTA text for the bottom display row
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: ota_show_until    # millis() until which ota_display replaces BAL/DSG
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ota_progress_step
    type: int
    restore_value: no
    initial_value: '-1'
  - id: ble_connect_ms    # last BMS connect (stale-link check)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ble_rx_ms         # last BMS frame, for the BT activity dot
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_stuck_ms     # since when the router is visible but not joined, 0 = not stuck (WiFi watchdog)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wifi_ok_ms        # last time WiFi was seen connected (WiFi watchdog)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: control_next_ms   # no control read before this (backoff after a failure)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: control_errors    # failed control.json reads since boot
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: upload_errors     # failed uploads since boot
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: bad_requests      # uploads rejected with 400 in a row
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: maintenance_ms    # when ota_install or radio_reset started (stuck-script guard)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: boot_sent         # this boot's boots/ entry is in Firebase
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: boot_in_flight
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: crash_sent        # the previous run's crash is in Firebase
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: crash_in_flight   # the upload in flight carries the saved crash
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ota_auth_header
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: fb_tx_ms          # last successful upload, for the WiFi activity dot
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  # Redraw twice a second only while a status icon is blinking, or until the OTA text times out
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: |-
              auto *wifi = esphome::wifi::global_wifi_component;
              const bool ota_text = id(ota_show_until) != 0 && (int32_t) (id(ota_show_until) - millis()) > -1000;
              return id(client0)->state() != esphome::esp32_ble_tracker::ClientState::ESTABLISHED ||
                     wifi == nullptr || !wifi->is_connected() || ota_text;
          then:
            - script.execute: redraw_display

  # Store one reading every sample_interval, and notice changes in the slow-moving info values
  - interval: ${sample_interval}
    then:
      - lambda: |-
          if (id(client0)->connected()) {
            char sig[256];
            snprintf(sig, sizeof(sig), "%s|%d%d%d%d|%.0f|%.3f %.3f %.3f %.3f|%.0f|%.0f|%s|%s|%s|%s|%s",
                     id(bms_errors).state.c_str(), (int) id(bms_charging_switch).state,
                     (int) id(bms_discharging_switch).state, (int) id(bms_balancer_switch).state,
                     (int) id(bms_heating).state, id(bms_charging_cycles).state,
                     id(bms_cell_resistance_1).state, id(bms_cell_resistance_2).state,
                     id(bms_cell_resistance_3).state, id(bms_cell_resistance_4).state,
                     id(bms_state_of_health).state, id(bms_full_charge_capacity).state,
                     id(bms_device_model).state.c_str(), id(bms_hardware_version).state.c_str(),
                     id(bms_software_version).state.c_str(), id(bms_serial_number).state.c_str(),
                     id(bms_manufacturing_date).state.c_str());
            if (id(info_sig) != sig || millis() - id(info_sent_ms) >= ${info_refresh_ms}) {
              id(info_sig) = sig;
              id(info_dirty) = true;
            }
          }

          if (!id(bms_fresh_frame) || !id(sntp_time).now().is_valid()) return;
          const float core[] = {id(bms_total_voltage).state, id(bms_current).state,
                                id(bms_cell_voltage_1).state, id(bms_cell_voltage_2).state,
                                id(bms_cell_voltage_3).state, id(bms_cell_voltage_4).state,
                                id(bms_capacity_remaining).state, id(bms_state_of_charge).state};
          for (float v : core) {
            if (std::isnan(v)) return;
          }
          id(bms_fresh_frame) = false;

          telemetry::Record r{};
          r.ts = id(sntp_time).now().timestamp;
          r.total_mv = lroundf(id(bms_total_voltage).state * 1000.0f);
          r.current_10ma = telemetry::scaled(id(bms_current).state, 100.0f);
          r.cell_mv[0] = lroundf(id(bms_cell_voltage_1).state * 1000.0f);
          r.cell_mv[1] = lroundf(id(bms_cell_voltage_2).state * 1000.0f);
          r.cell_mv[2] = lroundf(id(bms_cell_voltage_3).state * 1000.0f);
          r.cell_mv[3] = lroundf(id(bms_cell_voltage_4).state * 1000.0f);
          r.capacity_10mah = lroundf(id(bms_capacity_remaining).state * 100.0f);
          r.soc = lroundf(id(bms_state_of_charge).state);
          r.balancing_ma = telemetry::scaled(id(bms_balancing_current).state, 1000.0f);
          r.temp_dc[0] = telemetry::scaled(id(bms_mosfet_temperature).state, 10.0f);
          r.temp_dc[1] = telemetry::scaled(id(bms_temperature_sensor_1).state, 10.0f);
          r.temp_dc[2] = telemetry::scaled(id(bms_temperature_sensor_2).state, 10.0f);
          if (id(bms_charging).state) r.flags |= telemetry::CHARGING;
          if (id(bms_discharging).state) r.flags |= telemetry::DISCHARGING;
          if (id(bms_balancing).state) r.flags |= telemetry::BALANCING;
          telemetry::push(r);
          id(sample_seq)++;
          id(last_sample_ms) = millis();

  # Remote control from Firebase, read every control/check_s seconds (30..3600, default 300; the first
  # read ~30 s after boot). Commands the board acts on are removed from control by the board: it writes
  # control back without them, if-match the ETag of its read, so a command written in between is kept
  # (412: read again at the next tick).
  #   control/restart    any value (e.g. a timestamp): radio reset, once per value
  #   control/ota        version to install from control/ota_host, one attempt per signal
  #   control/ota_host   OTA base URL under an allowed domain (ota_control.h); a setting, kept
  #   control/ota_check  version whose .md5 is fetched once; result in device/ota_check
  #   control/check_s    read interval in seconds; a setting, kept
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: |-
                  if (id(ota_install).is_running() || id(radio_reset).is_running() || id(ota_active)) return false;
                  // After a failed read wait 2 min: each failed connect blocks the loop for 8-11 s
                  if ((int32_t) (millis() - id(control_next_ms)) < 0) return false;
                  if (id(control_force)) return true;
                  if (id(control_last_ms) == 0) return millis() >= 30000;
                  return millis() - id(control_last_ms) >= id(control_s) * 1000u;
          then:
            - lambda: |-
                crash::step(crash::STEP_CONTROL);
                id(control_force) = false;
                id(control_last_ms) = millis();
                id(control_put) = false;
                id(restart_go) = false;
                id(check_target) = "";
            - http_request.get:
                url: "${firebase_db_url}/control.json?auth=${firebase_auth}"
                request_headers:
                  X-Firebase-ETag: "true"
                collect_headers:
                  - etag
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        crash::step(crash::STEP_IDLE);
                        if (response->status_code != 200) {
                          id(control_errors)++;
                          id(control_next_ms) = millis() + 120000;
                          ESP_LOGW("control", "control read failed with code %d", response->status_code);
                          return;
                        }
                        JsonDocument doc;
                        if (deserializeJson(doc, body)) {
                          id(control_errors)++;
                          ESP_LOGW("control", "control.json is not valid JSON");
                          return;
                        }
                        id(control_etag) = response->get_response_header("etag");
                        bool clear_restart = false, clear_ota = false, clear_check = false;

                        // Read interval: a number or numeric string, clamped; missing or invalid = default
                        JsonVariant cs = doc["check_s"];
                        long want = cs.is<long>() ? cs.as<long>() : (cs.is<const char *>() ? atol(cs.as<const char *>()) : 0);
                        const uint32_t s = want <= 0 ? ${control_default_s}
                                                     : (uint32_t) std::clamp<long>(want, ${control_min_s}, ${control_max_s});
                        if (s != id(control_s)) ESP_LOGI("control", "Read interval %u s", (unsigned) s);
                        id(control_s) = s;

                        // Restart request (never while a new firmware still has to confirm itself)
                        std::string restart_token;
                        JsonVariant restart = doc["restart"];
                        if (restart.is<const char *>()) {
                          restart_token = restart.as<const char *>();
                        } else if (!restart.isNull()) {
                          serializeJson(restart, restart_token);
                        }
                        if (!restart_token.empty()) {
                          if (fnv1_hash(restart_token) == id(restart_hash)) {
                            clear_restart = true;  // handled before (its removal failed): only clean up
                          } else if (!id(ota_pending_verify)) {
                            id(restart_hash) = fnv1_hash(restart_token);
                            global_preferences->sync();
                            ESP_LOGW("control", "Restart requested (%s)", restart_token.c_str());
                            telemetry::set_restart_cause(telemetry::CAUSE_REMOTE);
                            id(restart_go) = true;
                            clear_restart = true;
                          }
                        }

                        // Update request: one attempt per signal, only from an allowed host
                        const std::string v = otactl::clean_version(doc["ota"] | "");
                        if (v.empty()) {
                          if (id(ota_requested)) {
                            id(ota_requested) = false;
                            id(ota_status) = "update " + id(ota_target) + " cancelled";
                            ESP_LOGI("ota", "%s", id(ota_status).c_str());
                          }
                        } else if (!id(ota_pending_verify) && !id(restart_go)) {
                          if (v == "${fw_version}") {
                            clear_ota = true;  // installed and confirmed
                          } else if (id(ota_failed_hash) != 0 && fnv1_hash(v) == id(ota_failed_hash)) {
                            clear_ota = true;  // rolled back (ota_status says so); a new signal may try again
                            id(ota_failed_hash) = 0;
                            global_preferences->sync();
                          } else if (v == id(ota_done)) {
                            clear_ota = true;  // failed or refused this boot: only clean up
                          } else if (id(ota_requested) && v == id(ota_target)) {
                            // accepted, waiting for the install to start
                          } else {
                            const std::string base = otactl::allowed_base(doc["ota_host"] | "");
                            if (base.empty()) {
                              id(ota_status) = "update refused: no/unknown OTA host for " + v;
                              id(ota_done) = v;
                              clear_ota = true;
                              ESP_LOGW("ota", "%s", id(ota_status).c_str());
                            } else {
                              id(ota_target) = v;
                              id(ota_base) = base;
                              id(ota_requested) = true;
                              id(ota_request_ms) = millis();
                              id(ota_status) = "update accepted " + v;
                              ESP_LOGI("ota", "%s from %s", id(ota_status).c_str(), base.c_str());
                            }
                          }
                        }

                        // Download check: fetch that version's .md5 once (next action), then remove the request
                        const std::string c = otactl::clean_version(doc["ota_check"] | "");
                        if (!c.empty()) {
                          clear_check = true;
                          const std::string base = otactl::allowed_base(doc["ota_host"] | "");
                          if (base.empty()) {
                            id(check_result) = c + ": refused, no/unknown OTA host";
                            id(check_ts) = id(sntp_time).now().is_valid() ? id(sntp_time).now().timestamp : 0;
                          } else {
                            id(check_target) = c;
                            id(check_base) = base;
                          }
                        }

                        // Write control back without the handled commands (settings and anything else stay)
                        if (clear_restart || clear_ota || clear_check) {
                          JsonDocument out;
                          for (JsonPair kv : doc.as<JsonObject>()) {
                            const char *k = kv.key().c_str();
                            if ((clear_restart && strcmp(k, "restart") == 0) || (clear_ota && strcmp(k, "ota") == 0) ||
                                (clear_check && strcmp(k, "ota_check") == 0)) continue;
                            out[k] = kv.value();
                          }
                          std::string rest;
                          if (out.as<JsonObject>().size() == 0) rest = "null";  // PUT null removes the node
                          else serializeJson(out, rest);
                          id(control_put_body) = rest;
                          id(control_put) = true;
                        }
                on_error:
                  then:
                    - lambda: |-
                        crash::step(crash::STEP_IDLE);
                        id(control_errors)++;
                        id(control_next_ms) = millis() + 120000;
                        ESP_LOGW("control", "control read error (free heap %u, largest block %u)",
                                 (unsigned) esp_get_free_heap_size(),
                                 (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
            # Download check: one GET of the version's .md5, as the install would fetch it
            - if:
                condition:
                  lambda: 'return !id(check_target).empty();'
                then:
                  - lambda: 'crash::step(crash::STEP_OTA_CHECK);'
                  - http_request.get:
                      url: !lambda 'return id(check_base) + "/jk-bms-" + id(check_target) + ".ota.bin.md5";'
                      request_headers:
                        Authorization: !lambda 'return id(ota_auth_header).c_str();'
                      collect_headers:
                        - content-type
                      capture_response: true
                      max_response_buffer_size: 64
                      on_response:
                        then:
                          - lambda: |-
                              crash::step(crash::STEP_IDLE);
                              // Must be the MD5 itself: a bot-check page also answers 200
                              bool md5 = response->status_code == 200 && body.size() >= 32 && body.size() <= 40;
                              for (size_t i = 0; md5 && i < 32; i++) md5 = isxdigit((unsigned char) body[i]);
                              char buf[160];
                              if (md5) {
                                snprintf(buf, sizeof(buf), "%s: ok", id(check_target).c_str());
                              } else {
                                snprintf(buf, sizeof(buf), "%s: not usable (HTTP %d, %s, %d bytes)", id(check_target).c_str(),
                                         response->status_code, response->get_response_header("content-type").c_str(),
                                         (int) response->content_length);
                              }
                              id(check_result) = buf;
                              id(check_ts) = id(sntp_time).now().is_valid() ? id(sntp_time).now().timestamp : 0;
                              ESP_LOGI("ota", "Download check %s", buf);
                      on_error:
                        then:
                          - lambda: |-
                              crash::step(crash::STEP_IDLE);
                              id(check_result) = id(check_target) + ": no response (DNS, connect, TLS or timeout)";
                              id(check_ts) = id(sntp_time).now().is_valid() ? id(sntp_time).now().timestamp : 0;
                              ESP_LOGW("ota", "Download check %s", id(check_result).c_str());
            # Remove the handled commands: write control back, only if it is unchanged since the read
            - if:
                condition:
                  lambda: 'return id(control_put) && !id(control_etag).empty();'
                then:
                  - lambda: 'crash::step(crash::STEP_CONTROL);'
                  - http_request.send:
                      method: PUT
                      url: "${firebase_db_url}/control.json?auth=${firebase_auth}"
                      request_headers:
                        Content-Type: application/json
                        if-match: !lambda 'return id(control_etag).c_str();'
                      body: !lambda 'return id(control_put_body);'
                      on_response:
                        then:
                          - lambda: |-
                              crash::step(crash::STEP_IDLE);
                              if (response->status_code == 412) {
                                id(control_force) = true;  // control changed since the read: read it again
                                ESP_LOGI("control", "control changed meanwhile, reading again");
                              } else if (response->status_code < 200 || response->status_code >= 300) {
                                id(control_errors)++;
                                ESP_LOGW("control", "removing handled commands failed with code %d", response->status_code);
                              } else {
                                ESP_LOGI("control", "handled commands removed");
                              }
                      on_error:
                        then:
                          - lambda: |-
                              crash::step(crash::STEP_IDLE);
                              id(control_errors)++;
                              ESP_LOGW("control", "removing handled commands failed (no response)");
            # Restart last, after its command was removed (restart_hash stops a repeat if the removal failed)
            - if:
                condition:
                  lambda: 'return id(restart_go);'
                then:
                  - lambda: |-
                      id(restart_go) = false;
                      id(ota_display) = "Restarting";
                      id(ota_show_until) = millis() + 5000;
                      id(oled_display).update();
                  - script.execute: radio_reset

  # Start an accepted update. Uploads are paused from acceptance; only readings in the RAM ring (lost to
  # the reboot) are uploaded first, for at most ota_backlog_wait_ms.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(ota_requested) || id(ota_install).is_running() || id(radio_reset).is_running()) return false;
              const size_t ram = telemetry::ram_size();
              if (ram > 0 && millis() - id(ota_request_ms) < ${ota_backlog_wait_ms}) {
                id(ota_status) = "update " + id(ota_target) + " waits for " + std::to_string(ram) + " older readings to upload";
                return false;
              }
              auto *wifi = esphome::wifi::global_wifi_component;
              return wifi != nullptr && wifi->is_connected();
          then:
            - lambda: |-
                id(ota_requested) = false;
                id(ota_active) = true;
                id(ota_attempt_hash) = fnv1_hash(id(ota_target));
                global_preferences->sync();
                id(ota_status) = "downloading " + id(ota_target);
                ESP_LOGI("ota", "Installing %s from %s (%u readings queued)", id(ota_target).c_str(), id(ota_base).c_str(),
                         (unsigned) telemetry::size());
            - script.execute: ota_install

  # A new firmware that has not uploaded successfully within the timeout rolls back to the previous one
  - interval: 30s
    then:
      - lambda: 'telemetry::note_uptime((uint32_t) (esp_timer_get_time() / 1000000));'
      # Stuck-script guard: an install or restart that never finishes would leave BLE off with no way
      # to recover remotely (both block new OTA and restart requests), so restart the hard way
      - lambda: |-
          if (!id(ota_install).is_running() && !id(radio_reset).is_running()) return;
          if (millis() - id(maintenance_ms) < ${maintenance_limit_ms}) return;
          ESP_LOGE("watchdog", "%s stuck for %u s, deep sleep restart",
                   id(ota_install).is_running() ? "ota_install" : "radio_reset",
                   (unsigned) ((millis() - id(maintenance_ms)) / 1000));
          telemetry::set_restart_cause(telemetry::CAUSE_STUCK_SCRIPT);
          global_preferences->sync();
          radio_sleep(1000000);  // stops BLE and WiFi first: sleeping with them on can deadlock the PHY
      - if:
          condition:
            lambda: 'return id(ota_pending_verify) && millis() > ${ota_verify_timeout_ms};'
          then:
            - lambda: 'ESP_LOGE("ota", "${fw_version} not confirmed within timeout, rolling back");'
            - script.execute: ble_disconnect_clean
            - script.wait: ble_disconnect_clean
            - lambda: 'esp_ota_mark_app_invalid_rollback_and_reboot();'
      # Radio reset after a software reset, once the firmware is confirmed and the status was uploaded
      # (never while pending verify: rebooting then would roll the update back)
      - if:
          condition:
            lambda: |-
              return id(needs_radio_reset) && !id(ota_pending_verify) &&
                     (id(uploaded_since_boot) || millis() > ${radio_reset_fallback_ms});
          then:
            - lambda: |-
                id(needs_radio_reset) = false;
                telemetry::set_restart_cause(telemetry::CAUSE_SOFT_RESET);
            - script.execute: radio_reset
      # Watchdogs: radio reset when the BMS link or WiFi stays down, with backoff (see ble_watchdog_ms)
      - if:
          condition:
            lambda: |-
              auto *wifi = esphome::wifi::global_wifi_component;
              const bool wifi_up = wifi != nullptr && wifi->is_connected();
              const uint32_t now = millis();
              if (wifi_up) id(wifi_ok_ms) = now;
              // Only a router we can see but not join is a reason to reset the radio
              bool router_seen = false;
              if (!wifi_up && wifi != nullptr) {
                for (const auto &r : wifi->get_scan_result()) router_seen |= r.get_matches();
              }
              if (wifi_up || !router_seen) id(wifi_stuck_ms) = 0;
              else if (id(wifi_stuck_ms) == 0) id(wifi_stuck_ms) = now;
              // Silence on a connected link counts from the later of the last frame and the connect
              const uint32_t heard_ms = std::max(id(ble_rx_ms), id(ble_connect_ms));
              const bool stale = id(client0)->connected() && heard_ms != 0 && now - heard_ms >= ${ble_stale_ms};
              const bool ble_ok = id(ble_rx_ms) != 0 && now - id(ble_rx_ms) < ${ble_watchdog_ms} && !stale;
              uint32_t &resets = telemetry::watchdog_resets();
              if (wifi_up && ble_ok) {
                resets = 0;
                return false;
              }
              if (id(ota_pending_verify) || id(ota_install).is_running() || id(radio_reset).is_running()) return false;
              const uint32_t mult = 1u << std::min<uint32_t>(resets, 3);
              const uint32_t ble_down = now - id(ble_rx_ms);  // since boot when no frame yet
              const uint32_t wifi_down = id(wifi_stuck_ms) == 0 ? 0 : now - id(wifi_stuck_ms);
              // A long blocking request can overflow the BLE event queue and lose the disconnect event:
              // the client then stays "connected" with a dead link and never reconnects
              if (stale) {
                ESP_LOGW("watchdog", "BMS link connected but silent for %u s, radio reset %u", (unsigned) ((now - heard_ms) / 1000),
                         (unsigned) resets + 1);
                telemetry::set_restart_cause(telemetry::CAUSE_BLE_WATCHDOG);
              } else if (ble_down >= ${ble_watchdog_ms} * mult) {
                ESP_LOGW("watchdog", "No BMS frame for %u s, radio reset %u", (unsigned) (ble_down / 1000), (unsigned) resets + 1);
                telemetry::set_restart_cause(telemetry::CAUSE_BLE_WATCHDOG);
              } else if (wifi_down >= ${wifi_watchdog_ms} * mult) {
                ESP_LOGW("watchdog", "Router visible but not joined for %u s, radio reset %u", (unsigned) (wifi_down / 1000), (unsigned) resets + 1);
                telemetry::set_restart_cause(telemetry::CAUSE_WIFI_WATCHDOG);
              } else {
                return false;
              }
              resets++;
              return true;
          then:
            - script.execute: radio_reset

  # One multi-path PATCH writes buffered readings, device diagnostics, and (when due) the info
  # node and an hourly energy counter. Readings leave the buffer only after Firebase replies 2xx.
  - interval: ${upload_check_interval}
    id: firebase_upload_interval
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: 'return id(sntp_time).now().is_valid();'
              - lambda: |-
                  // Never next to an install or radio reset (memory and radio belong to them); paused from the
                  // moment an update is accepted, unless RAM-ring readings must go up before the reboot
                  if (id(ota_install).is_running() || id(radio_reset).is_running() || id(ota_active)) return false;
                  if (id(ota_requested) && telemetry::ram_size() == 0) return false;
                  // Backoff only after a failure (a plain millis() compare would misfire after ~24.8 days idle)
                  if (id(upload_fails) > 0 && (int32_t) (millis() - id(upload_next_ms)) < 0) return false;
                  // First upload after boot (confirms a new firmware) and stale diagnostics go at once
                  if (id(ota_pending_verify) || !id(uploaded_since_boot) ||
                      millis() - id(last_upload_ms) >= ${upload_max_age_ms}) return true;
                  const uint32_t since = millis() - id(last_sample_ms);
                  // Right after a stored reading, once per reading
                  const bool in_phase = id(sample_seq) != id(upload_seq) && since < ${upload_phase_ms};
                  if (in_phase && (telemetry::size() >= ${upload_min_batch} || id(info_dirty))) return true;
                  // Free time: with a backlog, more uploads in the same cycle while the learned upload time
                  // plus a gap for fresh BMS frames still ends before the next reading
                  const bool backlog = telemetry::size() > ${upload_min_batch};
                  return backlog && id(last_sample_ms) != 0 && since + id(upload_ms_avg) + ${upload_gap_ms} < ${sample_interval_ms};
          then:
            - lambda: 'crash::step(crash::STEP_UPLOAD);'
            - http_request.send:
                method: PATCH
                url: "${firebase_db_url}/.json?auth=${firebase_auth}"
                request_headers:
                  Content-Type: application/json
                json: |-
                  const uint32_t now_ts = id(sntp_time).now().timestamp;

                  // Batch: smallest of the measured memory fit, the adaptive limit and the hard cap (at least 1)
                  const uint32_t free_now = esp_get_free_heap_size();
                  const int32_t room = (int32_t) free_now - (int32_t) id(upload_heap_base) - ${upload_heap_floor};
                  size_t fit = room > 0 ? (size_t) room / std::max<uint32_t>(id(upload_heap_per), 1) : 0;
                  if (heap_caps_get_largest_free_block(MALLOC_CAP_8BIT) < ${upload_min_block}) fit = 0;  // fragmented
                  const size_t n = std::min({telemetry::size(), (size_t) id(upload_cap), (size_t) ${upload_batch_max},
                                             std::max(fit, (size_t) 1)});
                  // Fresh snapshot first: a reading stored since the last upload always goes in this request;
                  // the rest of the batch is the oldest backlog (the RAM part, which a reboot would lose).
                  // Free-time uploads have no fresh reading and carry backlog only.
                  const bool fresh = n > 0 && id(sample_seq) != id(upload_seq);
                  const size_t old_n = fresh ? std::min(n - 1, telemetry::size() - 1) : n;
                  id(upload_fresh_ts) = fresh ? telemetry::peek(telemetry::size() - 1).ts : 0;
                  id(upload_old_n) = old_n;
                  id(upload_batch_n) = n;
                  id(upload_batch_last) = n;
                  id(upload_seq) = id(sample_seq);
                  id(upload_start_ms) = millis();
                  id(upload_heap_before) = free_now;
                  const size_t first = fresh ? 1 : 0;
                  for (size_t i = 0; i < first + old_n; i++) {
                    const telemetry::Record &r = i < first ? telemetry::peek(telemetry::size() - 1) : telemetry::peek(i - first);
                    JsonObject o = root[std::string("telemetry/") + std::to_string(r.ts)].to<JsonObject>();
                    o["total_voltage"] = r.total_mv / 1000.0;
                    if (r.current_10ma != telemetry::NO_VALUE) o["current"] = r.current_10ma / 100.0;
                    for (int c = 0; c < 4; c++) o["cell_voltage_" + std::to_string(c + 1)] = r.cell_mv[c] / 1000.0;
                    o["capacity_remaining"] = r.capacity_10mah / 100.0;
                    o["state_of_charge"] = r.soc;
                    if (r.balancing_ma != telemetry::NO_VALUE) o["balancing_current"] = r.balancing_ma / 1000.0;
                    const char *temp_keys[] = {"mosfet_temperature", "temperature_sensor_1", "temperature_sensor_2"};
                    for (int t = 0; t < 3; t++) {
                      if (r.temp_dc[t] != telemetry::NO_VALUE) o[temp_keys[t]] = r.temp_dc[t] / 10.0;
                    }
                    o["charging"] = (r.flags & telemetry::CHARGING) ? 1 : 0;
                    o["discharging"] = (r.flags & telemetry::DISCHARGING) ? 1 : 0;
                    o["balancing"] = (r.flags & telemetry::BALANCING) ? 1 : 0;
                  }

                  auto *wifi = esphome::wifi::global_wifi_component;
                  JsonObject d = root["device"].to<JsonObject>();
                  d["last_seen"] = now_ts;
                  d["uptime_s"] = (uint32_t) (esp_timer_get_time() / 1000000);
                  d["boot_count"] = telemetry::boot_count();
                  d["reset_reason"] = telemetry::reset_reason();
                  d["wifi_rssi"] = wifi != nullptr ? wifi->wifi_rssi() : 0;
                  d["wifi_disconnects"] = id(wifi_disconnects);
                  d["ble_connected"] = id(client0)->connected() ? 1 : 0;
                  d["ble_disconnects"] = id(ble_disconnects);
                  d["bms_rssi"] = id(bms_rssi);
                  d["bms_adverts"] = id(bms_adverts);
                  id(bms_adverts) = 0;
                  d["free_heap"] = esp_get_free_heap_size();
                  d["min_free_heap"] = esp_get_minimum_free_heap_size();
                  d["max_block"] = heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
                  d["control_s"] = id(control_s);
                  if (!id(check_result).empty()) {
                    d["ota_check"] = id(check_result);
                    d["ota_check_ts"] = id(check_ts);
                  }
                  // Last WiFi disconnect (reason code from ESP-IDF) and last failed upload, as unix times
                  const uint32_t now_ms = (uint32_t) (esp_timer_get_time() / 1000);
                  if (otactl::last_disc_ms != 0) {
                    d["wifi_disc_reason"] = (uint32_t) otactl::last_disc_reason;
                    d["wifi_disc_ts"] = now_ts - (now_ms - otactl::last_disc_ms) / 1000;
                  }
                  if (!id(upload_fail).empty()) {
                    d["upload_fail"] = id(upload_fail);
                    d["upload_fail_ts"] = now_ts - (millis() - id(upload_fail_ms)) / 1000;
                  }
                  if (id(client0)->connected() && id(bms_link_rssi).has_state() && !std::isnan(id(bms_link_rssi).state)) {
                    d["bms_link_rssi"] = (int) id(bms_link_rssi).state;
                  }
                  d["restart_cause"] = telemetry::restart_cause();
                  d["watchdog_resets"] = telemetry::watchdog_resets();
                  d["control_errors"] = id(control_errors);
                  d["upload_errors"] = id(upload_errors);
                  d["buffered"] = telemetry::size();
                  d["dropped"] = telemetry::dropped;
                  d["upload_batch"] = id(upload_batch_last);
                  d["upload_cap"] = id(upload_cap);
                  d["upload_ms"] = id(upload_ms_last);
                  d["upload_ms_avg"] = id(upload_ms_avg);
                  d["upload_heap_low"] = id(upload_heap_low);
                  d["upload_heap_base"] = id(upload_heap_base);
                  d["upload_heap_per"] = id(upload_heap_per);
                  d["firmware_version"] = "${fw_version}";
                  d["ota_status"] = id(ota_status);

                  id(info_in_flight) = id(info_dirty);
                  if (id(info_dirty)) {
                    auto num = [](JsonObject obj, const char *key, float v) {
                      if (!std::isnan(v)) obj[key] = v;
                    };
                    JsonObject inf = root["info"].to<JsonObject>();
                    inf["updated"] = now_ts;
                    inf["errors"] = id(bms_errors).state;
                    inf["charging_switch"] = id(bms_charging_switch).state ? 1 : 0;
                    inf["discharging_switch"] = id(bms_discharging_switch).state ? 1 : 0;
                    inf["balancer_switch"] = id(bms_balancer_switch).state ? 1 : 0;
                    inf["heating"] = id(bms_heating).state ? 1 : 0;
                    num(inf, "charging_cycles", id(bms_charging_cycles).state);
                    num(inf, "cell_resistance_1", id(bms_cell_resistance_1).state);
                    num(inf, "cell_resistance_2", id(bms_cell_resistance_2).state);
                    num(inf, "cell_resistance_3", id(bms_cell_resistance_3).state);
                    num(inf, "cell_resistance_4", id(bms_cell_resistance_4).state);
                    num(inf, "state_of_health", id(bms_state_of_health).state);
                    num(inf, "full_charge_capacity", id(bms_full_charge_capacity).state);
                    inf["device_model"] = id(bms_device_model).state;
                    inf["hardware_version"] = id(bms_hardware_version).state;
                    inf["software_version"] = id(bms_software_version).state;
                    inf["serial_number"] = id(bms_serial_number).state;
                    inf["manufacturing_date"] = id(bms_manufacturing_date).state;
                  }

                  // A crash saved by crash_capture.h goes up once, with the firmware that crashed
                  // (crashes before 1.2.9 have no step; report is empty if ESPHome had no data)
                  // One boots/<ts> entry per boot: why it started and how the previous run ended
                  id(boot_in_flight) = !id(boot_sent);
                  if (id(boot_in_flight)) {
                    JsonObject b = root[std::string("boots/") + std::to_string(now_ts)].to<JsonObject>();
                    b["firmware_version"] = "${fw_version}";
                    b["boot_count"] = telemetry::boot_count();
                    b["reset_reason"] = telemetry::reset_reason();
                    b["restart_cause"] = telemetry::restart_cause();
                    b["prev_uptime_s"] = telemetry::prev_uptime_s;
                    b["prev_step"] = crash::prev_step_name();
                    b["prev_shutdown"] = telemetry::prev_shutdown ? 1 : 0;
                    b["booted_ago_s"] = (uint32_t) (esp_timer_get_time() / 1000000);
                  }
                  id(crash_in_flight) = !id(crash_sent) && (crash::crashed() || !crash::report.empty());
                  if (id(crash_in_flight)) {
                    JsonObject c = root[std::string("crashes/") + std::to_string(now_ts)].to<JsonObject>();
                    c["reported_by"] = "${fw_version}";  // the crash itself may be from the firmware before an update
                    c["reset_reason"] = telemetry::reset_reason();
                    c["step"] = crash::last_step_name();
                    c["report"] = crash::report;
                  }

                  const float energy = id(bms_total_charging_cycle_capacity).state;
                  id(energy_in_flight) = !std::isnan(energy) &&
                      (id(last_energy_ms) == 0 || millis() - id(last_energy_ms) >= ${energy_interval_ms});
                  if (id(energy_in_flight)) {
                    root[std::string("energy/") + std::to_string(now_ts)] = energy;
                  }

                  // Measure this request's heap low point (read and stopped in on_response / on_error).
                  // stop() first: a request that ended without either callback must not leave it running.
                  heap_caps_monitor_local_minimum_free_size_stop();
                  heap_caps_monitor_local_minimum_free_size_start();
                on_response:
                  then:
                    - lambda: |-
                        crash::step(crash::STEP_IDLE);
                        const bool ok = response->status_code >= 200 && response->status_code < 300;
                        id(firebase_error) = !ok;
                        id(last_upload_ms) = millis();
                        if (ok) {
                          id(uploaded_since_boot) = true;
                          id(bad_requests) = 0;
                          if (id(upload_fresh_ts) != 0) telemetry::discard_newest(id(upload_fresh_ts));
                          telemetry::discard(id(upload_old_n));
                          if (id(ota_pending_verify)) {
                            // First good upload on a new firmware: keep it
                            esp_ota_mark_app_valid_cancel_rollback();
                            id(ota_pending_verify) = false;
                            id(ota_attempt_hash) = 0;
                            global_preferences->sync();
                            id(ota_status) = "updated to ${fw_version}";
                            id(ota_display) = "OTA updated ${fw_version}";
                            id(ota_show_until) = millis() + ${ota_text_short_ms};
                            ESP_LOGI("ota", "%s, confirmed", id(ota_status).c_str());
                            id(control_force) = true;  // read control now: removes control/ota naming this version
                          }
                          id(fb_tx_ms) = millis();
                          id(activity_pulse).execute();
                          if (id(info_in_flight)) {
                            id(info_dirty) = false;
                            id(info_sent_ms) = millis();
                          }
                          if (id(energy_in_flight)) id(last_energy_ms) = millis();
                          if (id(boot_in_flight)) id(boot_sent) = true;
                          if (id(crash_in_flight)) {
                            id(crash_sent) = true;
                            esphome::esp32::crash_handler_clear();
                          }
                        } else {
                          id(upload_errors)++;
                          ESP_LOGW("firebase", "Upload failed with code %d", response->status_code);
                          id(upload_fail) = "HTTP " + std::to_string(response->status_code);
                          id(upload_fail_ms) = millis();
                          // A batch Firebase keeps rejecting as malformed would block the buffer forever
                          if (response->status_code == 400 && ++id(bad_requests) >= ${bad_request_limit}) {
                            ESP_LOGE("firebase", "Dropping %u readings rejected %u times", (unsigned) id(upload_batch_n),
                                     (unsigned) id(bad_requests));
                            if (id(upload_fresh_ts) != 0) telemetry::discard_newest(id(upload_fresh_ts));
                            telemetry::discard(id(upload_old_n));
                            id(bad_requests) = 0;
                          }
                        }
                        id(info_in_flight) = false;
                        id(energy_in_flight) = false;

                        // Heap: this request's low point, then learn the fixed cost and the cost per reading.
                        // A higher measured cost is taken at once, a lower one only slowly (stay conservative).
                        const uint32_t low = heap_caps_get_minimum_free_size(MALLOC_CAP_DEFAULT);
                        heap_caps_monitor_local_minimum_free_size_stop();
                        id(upload_heap_low) = low;
                        const uint32_t n = std::max<uint32_t>(id(upload_batch_n), 1);
                        if (id(upload_heap_before) > low) {
                          const uint32_t used = id(upload_heap_before) - low;
                          // Slope from two uploads whose batch sizes differ by 2 or more
                          if (id(upload_prev_n) != 0 && (n >= id(upload_prev_n) + 2 || id(upload_prev_n) >= n + 2)) {
                            const int32_t slope = ((int32_t) used - (int32_t) id(upload_prev_used)) /
                                                  ((int32_t) n - (int32_t) id(upload_prev_n));
                            const uint32_t per = (uint32_t) std::clamp<int32_t>(slope, 300, 4000);
                            id(upload_heap_per) = per > id(upload_heap_per) ? per : (id(upload_heap_per) * 3 + per) / 4;
                          }
                          const uint32_t base = (uint32_t) std::max<int32_t>((int32_t) used - (int32_t) (n * id(upload_heap_per)), 8000);
                          id(upload_heap_base) = base > id(upload_heap_base) ? base : (id(upload_heap_base) * 7 + base) / 8;
                          id(upload_prev_used) = used;
                          id(upload_prev_n) = n;
                        }
                        const bool heap_low = low < ${upload_heap_floor};
                        if (heap_low) ESP_LOGW("firebase", "Heap low point %u B with %u readings, batch limit halved", (unsigned) low, (unsigned) n);

                        // Adapt: a full batch that went up within the time budget and above the heap floor earns
                        // one more reading; a slow, failed or memory-tight upload halves the limit
                        const uint32_t took = millis() - id(upload_start_ms);
                        id(upload_ms_last) = took;
                        id(upload_ms_avg) = (id(upload_ms_avg) * 3 + took) / 4;
                        if (ok && took <= ${upload_time_budget_ms} && !heap_low) {
                          if (id(upload_batch_n) >= id(upload_cap)) id(upload_cap) = std::min<uint32_t>(id(upload_cap) + 1, ${upload_batch_max});
                        } else {
                          id(upload_cap) = std::max<uint32_t>(id(upload_cap) / 2, 1);
                        }
                        if (ok) {
                          id(upload_fails) = 0;
                          id(upload_next_ms) = millis();
                        } else {
                          id(upload_fails)++;
                          const uint32_t cap_ms = id(ota_pending_verify) ? 30000 : ${upload_backoff_max_ms};
                          id(upload_next_ms) = millis() + std::min<uint32_t>(10000u << std::min<uint32_t>(id(upload_fails) - 1, 4), cap_ms);
                        }
                on_error:
                  then:
                    - lambda: |-
                        crash::step(crash::STEP_IDLE);
                        id(firebase_error) = true;
                        id(upload_errors)++;
                        id(last_upload_ms) = millis();
                        id(info_in_flight) = false;
                        id(energy_in_flight) = false;
                        id(upload_heap_low) = heap_caps_get_minimum_free_size(MALLOC_CAP_DEFAULT);
                        heap_caps_monitor_local_minimum_free_size_stop();
                        id(upload_ms_last) = millis() - id(upload_start_ms);
                        id(upload_ms_avg) = (id(upload_ms_avg) * 3 + id(upload_ms_last)) / 4;
                        id(upload_cap) = std::max<uint32_t>(id(upload_cap) / 2, 1);
                        id(upload_fails)++;
                        const uint32_t cap_ms = id(ota_pending_verify) ? 30000 : ${upload_backoff_max_ms};
                        id(upload_next_ms) = millis() + std::min<uint32_t>(10000u << std::min<uint32_t>(id(upload_fails) - 1, 4), cap_ms);
                        id(upload_fail) = "no response (DNS, connect, TLS or timeout)";
                        id(upload_fail_ms) = millis();
                        ESP_LOGE("firebase", "HTTP request error, %u readings buffered", (unsigned) telemetry::size());

# Short scan window (~9% duty) leaves radio time for the BMS connection and WiFi
esp32_ble_tracker:
  # Signal of the BMS as this board hears it (reported in device/bms_rssi, bms_adverts)
  on_ble_advertise:
    - mac_address: ${bms_mac_address}
      then:
        - lambda: |-
            id(bms_adverts)++;
            id(bms_rssi) = x.get_rssi();
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false

ble_client:
  - mac_address: ${bms_mac_address}
    id: client0
    on_connect:
      then:
        - lambda: 'id(ble_connect_ms) = millis();'
        - script.execute: redraw_display
    on_disconnect:
      then:
        - lambda: 'id(ble_disconnects)++;'
        - script.execute: redraw_display

# Redraw the OLED when data or connection state changes instead of polling.
# The 0s delay runs the redraw on the next loop pass, after the whole BMS frame has been
# published; mode: single folds several triggers in the same pass into one redraw.
script:
  - id: redraw_display
    mode: single
    then:
      - delay: 0s
      - component.update: oled_display

  # Show the activity dots now and redraw when each one should disappear
  - id: activity_pulse
    mode: restart
    then:
      - script.execute: redraw_display
      - delay: ${ble_dot_ms}ms
      - script.execute: redraw_display
      - delay: !lambda 'return ${upload_dot_ms} - ${ble_dot_ms};'
      - script.execute: redraw_display

  # Close the BMS link cleanly (terminate sent, client idle) before anything that reboots or stops BLE.
  # Auto-connect stays off so it cannot reconnect in between; a reboot or ble re-enable turns it back on.
  - id: ble_disconnect_clean
    mode: single
    then:
      - lambda: 'id(client0)->set_auto_connect(false);'
      - if:
          condition:
            lambda: 'return id(client0)->state() != esphome::esp32_ble_tracker::ClientState::IDLE;'
          then:
            # Not the ble_client.disconnect action: it waits for a GATT close event, which never comes
            # when the client is searching or connecting, and then the script hangs forever
            - lambda: 'id(client0)->disconnect();'
            - wait_until:
                condition:
                  lambda: 'return id(client0)->state() == esphome::esp32_ble_tracker::ClientState::IDLE;'
                timeout: 5s
      - lambda: 'ESP_LOGI("ble", "BMS link closed");'

  # Restart that powers the radio down: clean BLE disconnect, then a 1 s deep sleep. A plain software
  # reset (esp_restart) leaves BLE unable to connect to the BMS until the next power-on.
  - id: radio_reset
    mode: single
    then:
      - lambda: |-
          crash::step(crash::STEP_RADIO_RESET);
          id(maintenance_ms) = millis();
          id(ota_display) = "Restarting";
          id(ota_show_until) = millis() + 5000;
          id(oled_display).update();
      - script.execute: ble_disconnect_clean
      - script.wait: ble_disconnect_clean
      # restore_value globals (restart_hash) are saved by the globals loop; give it a few passes,
      # else a restart request whose hash was not saved restarts the board again after the wake
      - delay: 300ms
      - lambda: |-
          ESP_LOGW("radio", "Deep sleep 1 s to reset the radio");
          // safe_mode counts every restart within boot_is_good_after as a failed boot; ten deliberate
          // radio resets in a row would end in safe mode (no Firebase). A boot that has uploaded is good.
          // A boot that uploaded or read the BMS works; restarts without WiFi then never pile up into safe mode
          if ((id(uploaded_since_boot) || id(ble_rx_ms) != 0) && !id(ota_pending_verify)) id(safe_mode_component)->mark_successful();
          global_preferences->sync();
          radio_sleep(1000000);  // stops BLE and WiFi first: sleeping with them on can deadlock the PHY

  # Download and install id(ota_target). The download's TLS session does not fit next to the BLE
  # stack (free heap fell to <1 KB and the download stalled), so stop BLE first to free its memory
  # and give WiFi the radio. On success the board reboots; on failure ota_http's on_error restarts BLE.
  - id: ota_install
    mode: single
    then:
      - lambda: 'id(maintenance_ms) = millis();'
      - script.execute: ble_disconnect_clean
      - script.wait: ble_disconnect_clean
      - ble.disable:
      - wait_until:
          condition:
            not:
              ble.enabled:
          timeout: 10s
      - delay: 1s
      - lambda: |-
          ESP_LOGI("ota", "BLE stopped for download, free heap %u", (unsigned) esp_get_free_heap_size());
          // Full-power WiFi for the download: modem sleep costs throughput and beacons on a weak link.
          // Only allowed with the BT controller off.
          if (esp_bt_controller_get_status() != ESP_BT_CONTROLLER_STATUS_ENABLED) esp_wifi_set_ps(WIFI_PS_NONE);
          // Long read timeout only for the download: a link that pauses > 8 s made every try fail
          // (1.2.22 -> 1.2.23 next to the BMS). Normal requests keep 8 s so they block the loop less.
          id(http_client)->set_timeout(30000);
          id(http_client)->set_watchdog_timeout(60000);
          id(ota_display) = "OTA " + id(ota_target) + " 0%";
          id(ota_progress_step) = 0;
          id(ota_show_until) = millis() + ${ota_text_long_ms};
          crash::step(crash::STEP_OTA_FLASH);
      - component.update: oled_display
      - ota.http_request.flash:
          id: ota_http
          url: !lambda 'return id(ota_base) + "/jk-bms-" + id(ota_target) + ".ota.bin";'
          md5_url: !lambda 'return id(ota_base) + "/jk-bms-" + id(ota_target) + ".ota.bin.md5";'
          username: ${ota_username}
          password: ${ota_password}

jk_bms_ble:
  - ble_client_id: client0
    id: bms0
    protocol_version: ${protocol_version}
    throttle: 2s

sensor:
  # Signal of the connected BMS link itself (the advertisement RSSI goes stale while connected:
  # the BMS stops advertising). Reported as device/bms_link_rssi.
  - platform: ble_client
    type: rssi
    ble_client_id: client0
    id: bms_link_rssi
    internal: true
    update_interval: 60s

  - platform: jk_bms_ble
    jk_bms_ble_id: bms0

    # Every reading (30s)
    total_voltage:
      name: "Total Voltage"
      id: bms_total_voltage
      on_value:
        then:
          - lambda: |-
              id(bms_fresh_frame) = true;
              id(ble_rx_ms) = millis();
          - script.execute: activity_pulse
    current:
      name: "Current"
      id: bms_current
    cell_voltage_1:
      name: "Cell Voltage 1"
      id: bms_cell_voltage_1
    cell_voltage_2:
      name: "Cell Voltage 2"
      id: bms_cell_voltage_2
    cell_voltage_3:
      name: "Cell Voltage 3"
      id: bms_cell_voltage_3
    cell_voltage_4:
      name: "Cell Voltage 4"
      id: bms_cell_voltage_4
    capacity_remaining:
      name: "Capacity Remaining"
      id: bms_capacity_remaining
    state_of_charge:
      name: "State of Charge"
      id: bms_state_of_charge
    balancing_current:
      name: "Balancing Current"
      id: bms_balancing_current
    mosfet_temperature:
      name: "MOSFET Temperature"
      id: bms_mosfet_temperature
    temperature_sensor_1:
      name: "Temperature Sensor 1"
      id: bms_temperature_sensor_1
    temperature_sensor_2:
      name: "Temperature Sensor 2"
      id: bms_temperature_sensor_2

    # Hourly
    total_charging_cycle_capacity:
      name: "Total Charging Cycle Capacity"
      id: bms_total_charging_cycle_capacity

    # Info node (on change, at least daily)
    charging_cycles:
      name: "Charging Cycles"
      id: bms_charging_cycles
    state_of_health:
      name: "State of Health"
      id: bms_state_of_health
    full_charge_capacity:
      name: "Full Charge Capacity"
      id: bms_full_charge_capacity
    cell_resistance_1:
      name: "Cell Resistance 1"
      id: bms_cell_resistance_1
    cell_resistance_2:
      name: "Cell Resistance 2"
      id: bms_cell_resistance_2
    cell_resistance_3:
      name: "Cell Resistance 3"
      id: bms_cell_resistance_3
    cell_resistance_4:
      name: "Cell Resistance 4"
      id: bms_cell_resistance_4

text_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    errors:
      name: "Errors"
      id: bms_errors
    software_version:
      name: "Software Version"
      id: bms_software_version
    hardware_version:
      name: "Hardware Version"
      id: bms_hardware_version
    device_model:
      name: "Device Model"
      id: bms_device_model
    manufacturing_date:
      name: "Manufacturing Date"
      id: bms_manufacturing_date
    serial_number:
      name: "Serial Number"
      id: bms_serial_number

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    charging:
      name: "Charging"
      id: bms_charging
    discharging:
      name: "Discharging"
      id: bms_discharging
    balancing:
      name: "Balancing"
      id: bms_balancing
    heating:
      name: "Heating"
      id: bms_heating
    online_status:
      name: "Online Status"
      id: bms_online_status

switch:
  - platform: jk_bms_ble
    charging:
      name: "Charging Switch"
      id: bms_charging_switch
    discharging:
      name: "Discharging Switch"
      id: bms_discharging_switch
      on_state:
        then:
          - script.execute: redraw_display
    balancer:
      name: "Balancer Switch"
      id: bms_balancer_switch
      on_state:
        then:
          - script.execute: redraw_display
